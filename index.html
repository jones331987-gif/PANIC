/* ---------------------------------------------------------------
   Storage adapter — uses Claude.ai's window.storage when this file
   is running as a Claude artifact, and falls back to plain
   localStorage when deployed standalone (e.g. on GitHub Pages).
--------------------------------------------------------------- */
const appStorage =
  typeof window !== "undefined" && window.storage
    ? window.storage
    : {
        async get(key) {
          const v = localStorage.getItem(key);
          if (v === null) throw new Error("not found");
          return { key, value: v };
        },
        async set(key, value) {
          localStorage.setItem(key, value);
          return { key, value };
        },
        async delete(key) {
          localStorage.removeItem(key);
          return { key, deleted: true };
        },
        async list(prefix = "") {
          const keys = Object.keys(localStorage).filter((k) => k.startsWith(prefix));
          return { keys };
        },
      };

function stanceCountForLevel(level) {
  return Math.min(7, 3 + Math.floor((level - 1) / 2));
}
function superMoveSlotsForLevel(level) {
  return level >= 6 ? 2 : level >= 2 ? 1 : 0;
}
function rowForLevel(level) {
  return ADVANCEMENT_TABLE.find((r) => r.level === level) || ADVANCEMENT_TABLE[0];
}

/* ---------- Level 4 Fused Archetype / Level 8 Improved Archetype resolution ---------- */
// Returns every currently-active Archetype Ability entry: { key, name, tier }.
// tier is 'focused' | 'fused' | 'frantic', matching keys in GAME_DATA.archetypes[name].
function activeArchetypeEntries(char) {
  const lvl = char.level || 1;
  let list = [];

  if (char.heroType === "Focused") {
    list.push({ key: "core-1", name: char.archetype1, tier: "focused" });
  } else if (char.heroType === "Fused") {
    list.push({ key: "core-1", name: char.archetype1, tier: "fused" });
    list.push({ key: "core-2", name: char.archetype2, tier: "fused" });
  } else {
    list.push({ key: "core-1", name: char.archetype1, tier: "frantic" });
    list.push({ key: "core-2", name: char.archetype2, tier: "frantic" });
    list.push({ key: "core-3", name: char.archetype3, tier: "frantic" });
  }

  if (lvl >= 4 && char.bonusArchetype) {
    list.push({ key: "bonus", name: char.bonusArchetype, tier: "fused" });
  }

  if (lvl >= 8) {
    if (char.heroType === "Fused" && char.improvedArchetype) {
      list = list.map((e) =>
        e.key !== "bonus" && e.name === char.improvedArchetype ? { ...e, tier: "focused" } : e
      );
    } else if (char.heroType === "Frantic") {
      if (char.level8Choice === "upgradeBonus" && char.bonusArchetype) {
        list = list.map((e) => (e.key === "bonus" ? { ...e, tier: "focused" } : e));
      } else if (char.level8Choice === "newFused" && char.secondBonusArchetype) {
        list.push({ key: "bonus2", name: char.secondBonusArchetype, tier: "fused" });
      }
    } else if (char.heroType === "Focused") {
      if (char.level8Choice === "upgradeBonus" && char.bonusArchetype) {
        list = list.map((e) => (e.key === "bonus" ? { ...e, tier: "focused" } : e));
      } else if (char.level8Choice === "stackFocused") {
        list.push({ key: "stacked", name: char.archetype1, tier: "fused" });
      }
    }
  }

  return list.filter((e) => e.name);
}

// Only the archetypes actually chosen via Hero Type (ignores unused archetype2/3 fields for Focused, etc.)
function coreArchetypeNames(char) {
  if (char.heroType === "Focused") return [char.archetype1];
  if (char.heroType === "Fused") return [char.archetype1, char.archetype2];
  return [char.archetype1, char.archetype2, char.archetype3];
}

// Deduped archetype names whose Styles can currently be picked for a Stance.
function styleArchetypeNames(char) {
  const names = [];
  activeArchetypeEntries(char).forEach((e) => {
    if (!names.includes(e.name)) names.push(e.name);
  });
  return names;
}

function entryLabel(entry, isCore) {
  if (entry.key === "bonus" || entry.key === "bonus2") return `${entry.tier.toUpperCase()} · BONUS ARCHETYPE`;
  if (entry.key === "stacked") return "FUSED · STACKED";
  return entry.tier.toUpperCase();
}

// Given the list of currently-available archetype names and a stance's stored
// archetype choice, resolve which archetype actually applies (falls back
// sensibly if there's only one option, or the stored choice is now stale).
function resolveStanceArchetype(names, stanceArchetype) {
  if (!names || names.length === 0) return stanceArchetype;
  if (names.length === 1) return names[0];
  return names.includes(stanceArchetype) ? stanceArchetype : names[0];
}

      </div>
      {children}
    </div>
  );
}

  width: "100%",
  padding: "9px 10px",
  fontSize: 13.5,
  fontFamily: monoFont,
  border: `1px solid #2c3f52`,
  borderRadius: 3,
  background: "#0a121d",
  color: textMain,
  outline: "none",

const inputStyle = { ...selectStyle };

const textAreaStyle = {
  ...selectStyle,
  minHeight: 80,
  resize: "vertical",
  lineHeight: 1.5,
};

          style={{
            flex: 1,
            padding: "8px 6px",

            fontSize: 11.5,
            letterSpacing: 0.5,

function TypeToggle({ options, value, onChange }) {

/* ---------- collapsible stance readout used in Combat tab ---------- */
function StanceCard({ i, form, style, archetype, archetypeAbilities, expanded, onToggle }) {
  const stanceLabel = style
    ? `${style.name.replace(" Style", "")} ${form.name.replace(" Form", "")}`
    : form.name;

  return (
    <div
      style={{
        border: `1px solid ${expanded ? cyan : "#243748"}`,
        borderRadius: 4,
        marginBottom: 10,
        background: "#0a121d",
        overflow: "hidden",
        transition: "border-color .15s",
      }}
    >
      <button
        onClick={onToggle}
        style={{
          width: "100%",
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
          padding: "10px 12px",
          background: expanded ? `${cyan}14` : "transparent",
          border: "none",
          cursor: "pointer",
          textAlign: "left",
        }}
      >
        <div>
          <div style={{ fontFamily: headFont, fontSize: 13, letterSpacing: 1, color: cyan }}>
            STANCE {i + 1} — {stanceLabel.toUpperCase()}
          </div>
          <div style={{ fontFamily: monoFont, fontSize: 11, color: dim, marginTop: 2 }}>
            {style ? `RANGE ${style.range}` : "no style selected"} · {archetype}
          </div>
        </div>
        <div
          style={{
            color: cyan,
            fontFamily: monoFont,
            fontSize: 16,
            transform: expanded ? "rotate(180deg)" : "none",
            transition: "transform .15s",
          }}
        >
          ▾
        </div>
      </button>

      {expanded && (
        <div style={{ padding: "0 12px 14px", fontFamily: monoFont, fontSize: 12.5, lineHeight: 1.6, color: "#c3dced" }}>
          <div style={{ borderTop: "1px solid #1c2c3b", paddingTop: 10, marginTop: 2 }}>
            <div style={{ color: amber, fontWeight: 700, marginBottom: 3 }}>
              FORM · {form.name.toUpperCase()}{" "}
              <span style={{ color: dim, fontWeight: 400 }}>({form.alts})</span>
            </div>
            <div style={{ marginBottom: 6 }}>{form.ability}</div>
            {form.actions.map((a) => (
              <div key={a.name} style={{ marginBottom: 3 }}>
                <span style={{ color: cyan }}>
                  {a.cost}: {a.name}
                </span>{" "}
                — {a.effect}
              </div>
            ))}
            <div style={{ marginTop: 4, color: dim, fontStyle: "italic" }}>SKILL · {form.skill}</div>
          </div>

          {style && (
            <div style={{ borderTop: "1px solid #1c2c3b", paddingTop: 10, marginTop: 10 }}>
              <div style={{ color: magenta, fontWeight: 700, marginBottom: 3 }}>
                STYLE · {style.name.toUpperCase()} <span style={{ color: dim, fontWeight: 400 }}>(range {style.range})</span>
              </div>
              <div>{style.ability}</div>
            </div>
          )}

          {(archetypeAbilities || []).map((entry) => (
            <div key={entry.key} style={{ borderTop: "1px solid #1c2c3b", paddingTop: 10, marginTop: 10 }}>
              <div style={{ color: "#7dffa0", fontWeight: 700, marginBottom: 3 }}>
                {entryLabel(entry)} {archetype.toUpperCase()} ABILITY{" "}
                <span style={{ color: dim, fontWeight: 400 }}>(always active, regardless of Stance)</span>
              </div>
              <div>{GAME_DATA.archetypes[entry.name][entry.tier]}</div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function App() {
  const [char, setChar] = useState(emptyChar());
  const [tab, setTab] = useState("build");
  const [expanded, setExpanded] = useState({ 0: true, 1: false, 2: false });
  const [savedRoster, setSavedRoster] = useState([]);
  const [selectedSave, setSelectedSave] = useState("");
  const [linkStatus, setLinkStatus] = useState("");
  const [linkBusy, setLinkBusy] = useState(false);

  function slugify(str) {
    return (
      (str || "").trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") ||
      "unnamed-hero"
    );
  }

  async function refreshRoster() {
    try {
      const res = await appStorage.list("hero:");
      setSavedRoster((res && res.keys) || []);
    } catch (e) {
      setSavedRoster([]);
    }
  }

  React.useEffect(() => {
    refreshRoster();
  }, []);

  async function saveHero() {
    setLinkBusy(true);
    setLinkStatus("");
    try {
      const key = `hero:${slugify(char.name)}`;
      const result = await appStorage.set(key, JSON.stringify(char));
      if (result) {
        setLinkStatus(`SAVED — "${char.name || "Unnamed Hero"}"`);
        await refreshRoster();
        setSelectedSave(key);
      } else {
        setLinkStatus("SAVE FAILED — LINK ERROR");
      }
    } catch (e) {
      setLinkStatus("SAVE FAILED — LINK ERROR");
    }
    setLinkBusy(false);
  }

  async function loadHero(key) {
    if (!key) return;
    setLinkBusy(true);
    setLinkStatus("");
    try {
      const result = await appStorage.get(key);
      if (result && result.value) {
        const loaded = JSON.parse(result.value);
        setChar({ ...emptyChar(), ...loaded });
        setLinkStatus(`LOADED — "${loaded.name || "Unnamed Hero"}"`);
      } else {
        setLinkStatus("NOT FOUND ON RECORD");
      }
    } catch (e) {
      setLinkStatus("LOAD FAILED — LINK ERROR");
    }
    setLinkBusy(false);
  }

  async function deleteHero(key) {
    if (!key) return;
    setLinkBusy(true);
    try {
      await appStorage.delete(key);
      setLinkStatus("RECORD PURGED");
      setSelectedSave("");
      await refreshRoster();
    } catch (e) {
      setLinkStatus("DELETE FAILED — LINK ERROR");
    }
    setLinkBusy(false);
  }

  function newHero() {
    setChar(emptyChar());
    setSelectedSave("");
    setLinkStatus("NEW RECORD STARTED");
  }

  const archetypesAvailable = useMemo(
    () => styleArchetypeNames(char),
    [
      char.heroType,
      char.archetype1,
      char.archetype2,
      char.archetype3,
      char.level,
      char.bonusArchetype,
      char.level8Choice,
      char.improvedArchetype,
      char.secondBonusArchetype,
    ]
  );

  const activeAbilities = useMemo(
    () => activeArchetypeEntries(char),
    [
      char.heroType,
      char.archetype1,
      char.archetype2,
      char.archetype3,
      char.level,
      char.bonusArchetype,
      char.level8Choice,
      char.improvedArchetype,
      char.secondBonusArchetype,
    ]
  );

  function update(patch) {
    setChar((c) => ({ ...c, ...patch }));
  }

  function updateStance(i, patch) {
    setChar((c) => {
      const stances = c.stances.map((s, idx) => (idx === i ? { ...s, ...patch } : s));
      return { ...c, stances };
    });
  }

  function updateForm(i, formName) {
    setChar((c) => {
      const forms = c.forms.map((f, idx) => (idx === i ? formName : f));
      return { ...c, forms };
    });
  }

  function updateSkill(i, val) {
    setChar((c) => {
      const skills = c.skills.map((s, idx) => (idx === i ? val : s));
      return { ...c, skills };
    });
  }

  function bumpToken(type, delta) {
    setChar((c) => ({
      ...c,
      tokens: { ...c.tokens, [type]: Math.max(0, (c.tokens[type] || 0) + delta) },
    }));
  }

  function bumpHp(delta) {
    setChar((c) => ({ ...c, hp: Math.max(0, Math.min(c.maxHp, c.hp + delta)) }));
  }

  function labelFromKey(key) {
    return key
      .replace(/^hero:/, "")
      .split("-")
      .map((w) => (w ? w[0].toUpperCase() + w.slice(1) : w))
      .join(" ");
  }

  function buildExportText() {
    const lines = [];
    lines.push("=".repeat(48));
    lines.push(`PANIC AT THE DOJO — HERO RECORD`);
    lines.push(`VARA SPIRAL NETWORK · OMEGA QUADRANT RELAY`);
    lines.push("=".repeat(48));
    lines.push("");
    lines.push(`NAME:      ${char.name || "Unnamed Hero"}`);
    lines.push(`PLAYER:    ${char.player || "—"}`);
    lines.push(`HERO TYPE: ${char.heroType}`);
    lines.push(`ARCHETYPES: ${archetypesAvailable.join(", ")}`);
    lines.push(`HP:        ${char.hp} / ${char.maxHp}`);
    lines.push("");
    activeAbilities.forEach((entry) => {
      lines.push(`[${entry.tier.toUpperCase()} ${entry.name.toUpperCase()}]`);
      lines.push(GAME_DATA.archetypes[entry.name][entry.tier]);
      lines.push("");
    });
    lines.push("-".repeat(48));
    lines.push("STANCES");
    lines.push("-".repeat(48));
    char.stances.slice(0, stanceCountForLevel(char.level)).forEach((s, i) => {
      const form = formObjs[i];
      if (!form) return;
      const stanceArchetype = resolveStanceArchetype(archetypesAvailable, s.archetype);
      const styleObj = (GAME_DATA.styles[stanceArchetype] || []).find((x) => x.name === s.style);
      const label = styleObj ? `${styleObj.name.replace(" Style", "")} ${form.name.replace(" Form", "")}` : form.name;
      lines.push("");
      lines.push(`STANCE ${i + 1}: ${label}`);
      lines.push(`  Form: ${form.name} (${form.alts})`);
      lines.push(`    ${form.ability}`);
      form.actions.forEach((a) => lines.push(`    ${a.cost}: ${a.name} — ${a.effect}`));
      lines.push(`    Skill: ${form.skill}`);
      if (styleObj) {
        lines.push(`  Style: ${styleObj.name} (Range ${styleObj.range})`);
        lines.push(`    ${styleObj.ability}`);
      } else {
        lines.push(`  Style: — not selected —`);
      }
    });
    lines.push("");
    lines.push("-".repeat(48));
    lines.push("SKILLS");
    lines.push("-".repeat(48));
    char.skills.forEach((sk, i) => {
      lines.push(`  ${i + 1}. ${sk || formObjs[i]?.skill || "—"}`);
    });
    lines.push("");
    lines.push("-".repeat(48));
    lines.push("TOKENS ON HAND");
    lines.push("-".repeat(48));
    TOKEN_TYPES.forEach((t) => lines.push(`  ${t.key}: ${char.tokens[t.key] || 0}`));
    if (char.notes) {
      lines.push("");
      lines.push("-".repeat(48));
      lines.push("FIELD NOTES");
      lines.push("-".repeat(48));
      lines.push(char.notes);
    }
    lines.push("");
    lines.push("=".repeat(48));
    lines.push("END TRANSMISSION");
    lines.push("=".repeat(48));
    return lines.join("\n");
  }

  function downloadExport() {
    const text = buildExportText();
    const blob = new Blob([text], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${slugify(char.name)}-hero-sheet.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  const formObjs = char.forms.map((fn) => GAME_DATA.forms.find((f) => f.name === fn));
  const hpPct = char.maxHp > 0 ? char.hp / char.maxHp : 0;
  const hpColor = hpPct <= 0.25 ? danger : hpPct <= 0.5 ? amber : cyan;

  return (
    <div
      style={{
        minHeight: "100vh",
        background: `
          radial-gradient(ellipse at 20% -10%, #10233a 0%, transparent 55%),
          radial-gradient(ellipse at 100% 0%, #2a0f3a 0%, transparent 45%),
          ${bg0}`,
        fontFamily: monoFont,
        color: textMain,
        padding: "0 0 60px",
      }}
    >
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap');
        * { box-sizing: border-box; }
        ::selection { background: ${cyan}; color: #001018; }
        .tab-btn { transition: all .15s; cursor: pointer; }
        .tab-btn:hover { filter: brightness(1.3); }
        input:focus, select:focus, textarea:focus { border-color: ${cyan} !important; box-shadow: 0 0 0 1px ${cyan}55; }
        .tok-btn { transition: transform .1s; cursor: pointer; }
        .tok-btn:active { transform: scale(0.88); }
        body { background: ${bg0}; }
        @keyframes scan {
          0% { background-position: 0 0; }
          100% { background-position: 0 40px; }
        }
        @media print {
          body * { visibility: hidden; }
          #export-sheet, #export-sheet * { visibility: visible; }
          #export-sheet { position: absolute; top: 0; left: 0; width: 100%; }
        }
      `}</style>

      {/* Header */}
      <div
        style={{
          position: "relative",
          background: `linear-gradient(180deg, #0c1524, #060a12)`,
          borderBottom: `1px solid ${cyan}44`,
          padding: "26px 20px 20px",
          textAlign: "center",
          overflow: "hidden",
        }}
      >
        <div
          style={{
            position: "absolute",
            inset: 0,
            backgroundImage: `repeating-linear-gradient(180deg, ${cyan}08 0px, transparent 2px, transparent 4px)`,
            animation: "scan 6s linear infinite",
            pointerEvents: "none",
          }}
        />
        <div
          style={{
            fontFamily: headFont,
            fontWeight: 900,
            fontSize: 34,
            letterSpacing: 5,
            color: textMain,
            lineHeight: 1.1,
            textShadow: `0 0 18px ${cyan}88`,
          }}
        >
          PANIC <span style={{ color: cyan }}>//</span> DOJO
        </div>
        <div
          style={{
            fontFamily: monoFont,
            fontSize: 11,
            letterSpacing: 3,
            color: dim,
            marginTop: 6,
            textTransform: "uppercase",
          }}
        >
          [ hero build interface · combat readout · stance archive ]
        </div>
        <div
          style={{
            fontFamily: monoFont,
            fontSize: 9.5,
            letterSpacing: 2,
            color: "#3a4c5c",
            marginTop: 10,
          }}
        >
          RELAYED FROM THE OMEGA QUADRANT · FREE SPACE UPLINK · VARA SPIRAL NETWORK
        </div>
      </div>

      {/* Tabs */}
      <div
        style={{
          display: "flex",
          flexWrap: "wrap",
          justifyContent: "center",
          gap: 8,
          margin: "18px auto 0",
          maxWidth: 640,
          padding: "0 16px",
        }}
      >
        {[
          ["build", "Build Hero"],
          ["combat", "Combat Tracker"],
          ["reference", "Stance Reference"],
          ["export", "Export Sheet"],
        ].map(([key, label]) => (
          <button
            key={key}
            className="tab-btn"
            onClick={() => setTab(key)}
            style={{
              flex: "1 1 auto",
              minWidth: 120,
              padding: "10px 8px",
              fontFamily: headFont,
              fontSize: 13,
              letterSpacing: 1,
              border: `1px solid ${tab === key ? cyan : "#233448"}`,
              borderRadius: 3,
              background: tab === key ? `${cyan}1f` : "#0a121d",
              color: tab === key ? cyan : dim,
              textTransform: "uppercase",
              boxShadow: tab === key ? `0 0 14px -4px ${cyan}` : "none",
            }}
          >
            {label}
          </button>
        ))}
      </div>

      <div style={{ maxWidth: 640, margin: "22px auto 0", padding: "0 16px" }}>
        {tab === "build" && (
          <>
            <Panel title="Data Link" tag="PERSONAL STORAGE — LOCAL TO THIS DEVICE" glow="#7dffa0">
              <div style={{ display: "grid", gridTemplateColumns: "1fr auto", gap: 8, marginBottom: 10 }}>
                <button
                  disabled={linkBusy}
                  onClick={saveHero}
                  style={{
                    ...linkBtnStyle("#7dffa0"),
                    opacity: linkBusy ? 0.5 : 1,
                  }}
                >
                  ⬇ SAVE HERO
                </button>
                <button disabled={linkBusy} onClick={newHero} style={linkBtnStyle(dim)}>
                  + NEW
                </button>
              </div>
              <Field label="Load / delete a saved record">
                <div style={{ display: "grid", gridTemplateColumns: "1fr auto auto", gap: 6 }}>
                  <select
                    style={selectStyle}
                    value={selectedSave}
                    onChange={(e) => setSelectedSave(e.target.value)}
                  >
                    <option value="">— select saved hero —</option>
                    {savedRoster.map((key) => (
                      <option key={key} value={key}>
                        {labelFromKey(key)}
                      </option>
                    ))}
                  </select>
                  <button
                    disabled={linkBusy || !selectedSave}
                    onClick={() => loadHero(selectedSave)}
                    style={linkBtnStyle(cyan)}
                  >
                    LOAD
                  </button>
                  <button
                    disabled={linkBusy || !selectedSave}
                    onClick={() => deleteHero(selectedSave)}
                    style={linkBtnStyle(danger)}
                  >
                    DEL
                  </button>
                </div>
              </Field>
              {linkStatus && (
                <div style={{ fontFamily: monoFont, fontSize: 11, color: dim, letterSpacing: 1 }}>
                  &gt; {linkStatus}
                </div>
              )}
            </Panel>

            <Panel title="Hero Identity" tag="FEDERATION CIVIL REGISTRY — LAMBDA QUADRANT">
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                <Field label="Hero Name">
                  <input
                    style={inputStyle}
                    value={char.name}
                    onChange={(e) => update({ name: e.target.value })}
                    placeholder="e.g. Crimson Fang"
                  />
                </Field>
                <Field label="Player">
                  <input
                    style={inputStyle}
                    value={char.player}
                    onChange={(e) => update({ player: e.target.value })}
                    placeholder="Your name"
                  />
                </Field>
              </div>
              <Field label="Hero Type">
                <TypeToggle options={HERO_TYPES} value={char.heroType} onChange={(t) => update({ heroType: t })} />
                <div style={{ fontSize: 11.5, color: dim, marginTop: 8, lineHeight: 1.5 }}>
                  {char.heroType === "Focused" &&
                    "One Archetype, all 3 Styles from it. Strong, reliable Ability."}
                  {char.heroType === "Fused" &&
                    "Two Archetypes — 2 Styles from one, 1 from the other. Two half-strength Abilities."}
                  {char.heroType === "Frantic" &&
                    "Three Archetypes, ultimate flexibility — but you can't repeat last turn's Form, Style, or Ability."}
                </div>
              </Field>
            </Panel>

            <Panel title="Character Details" tag="DOSSIER — DESCRIPTIVE RECORD">
              <Field label="Build">
                <select style={selectStyle} value={char.build} onChange={(e) => update({ build: e.target.value })}>
                  {BUILD_DATA.map((b) => (
                    <option key={b.name} value={b.name}>
                      {b.name}
                    </option>
                  ))}
                </select>
              </Field>
              {(() => {
                const b = BUILD_DATA.find((x) => x.name === char.build);
                if (!b) return null;
                return (
                  <div
                    style={{
                      background: "#0a121d",
                      border: `1px solid #2c3f52`,
                      borderLeft: `3px solid ${amber}`,
                      borderRadius: 3,
                      padding: "8px 12px",
                      marginBottom: 12,
                      fontSize: 12.5,
                      lineHeight: 1.55,
                    }}
                  >
                    <div style={{ color: dim, fontStyle: "italic", marginBottom: 4 }}>{b.flavor}</div>
                    <div style={{ color: amber }}>{b.bonus}</div>
                  </div>
                );
              })()}
              <Field label="Fourth Skill (two-word descriptor, e.g. 'Eccentric Gambler')">
                <input
                  style={inputStyle}
                  value={char.descriptor}
                  onChange={(e) => update({ descriptor: e.target.value })}
                  placeholder="e.g. Terrified Clerk"
                />
              </Field>
              <Field label="Appearance">
                <textarea
                  style={{ ...textAreaStyle, minHeight: 60 }}
                  value={char.appearance}
                  onChange={(e) => update({ appearance: e.target.value })}
                  placeholder="What do they look like? Notable gear, scars, style..."
                />
              </Field>
              <Field label="Personality & Backstory">
                <textarea
                  style={textAreaStyle}
                  value={char.backstory}
                  onChange={(e) => update({ backstory: e.target.value })}
                  placeholder="Who are they, and how did they end up here?"
                />
              </Field>
            </Panel>

            <Panel
              title="Advancement"
              glow="#7dffa0"
              tag="1E PATCH'D UP — LEVEL &amp; EXPERIENCE"
              right={
                <span style={{ fontFamily: monoFont, fontSize: 10, color: dim }}>
                  LVL {char.level} / 10
                </span>
              }
            >
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                <Field label="Level">
                  <input
                    type="number"
                    min={1}
                    max={10}
                    style={inputStyle}
                    value={char.level}
                    onChange={(e) => {
                      const v = Math.max(1, Math.min(10, parseInt(e.target.value) || 1));
                      const slots = superMoveSlotsForLevel(v);
                      const patch = { level: v, superMoves: char.superMoves.slice(0, slots) };
                      if (v < 4) {
                        patch.bonusArchetype = "";
                      }
                      if (v < 8) {
                        patch.level8Choice = "";
                        patch.improvedArchetype = "";
                        patch.secondBonusArchetype = "";
                      }
                      update(patch);
                    }}
                  />
                </Field>
                <Field label="XP">
                  <input
                    type="number"
                    min={0}
                    style={inputStyle}
                    value={char.xp}
                    onChange={(e) => update({ xp: Math.max(0, parseInt(e.target.value) || 0) })}
                  />
                </Field>
              </div>
              {(() => {
                const row = rowForLevel(char.level);

              ))}
              <div
                style={{
                  fontSize: 11.5,
                  color: dim,
                  lineHeight: 1.6,
                  borderTop: "1px dashed #223546",
                  paddingTop: 10,
                  marginTop: 4,
                }}
              >
                <b style={{ color: textMain }}>Super Tokens</b> are Rare Tokens granted only by Super
                Moves. They can't be discarded, duplicated, or converted by any Ability or Action, even
                other Super Moves.
                <br />
                <b style={{ color: textMain }}>Token Cap:</b> you can never hold more than 10 tokens of a
                single type. Discard the extra if you'd gain more.
              </div>
            </Panel>

            <Panel title="Archetype Compendium" glow="#7dffa0" tag="TAGS · SUPER MOVES · FULL INDEX">
              {ARCHETYPE_NAMES.map((a) => {
                const arch = GAME_DATA.archetypes[a];
                return (
                  <div
                    key={a}
                    style={{
                      background: "#0a121d",
                      border: "1px solid #223546",
                      borderRadius: 4,
                      padding: "10px 12px",
                      marginBottom: 8,
                      fontSize: 12.5,
                      lineHeight: 1.55,
                    }}
                  >
                    <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 6 }}>
                      <b style={{ color: "#7dffa0", fontFamily: headFont, letterSpacing: 1 }}>{a.toUpperCase()}</b>
                      <div style={{ display: "flex", gap: 4 }}>
                        {(arch.tags || []).map((t) => (
                          <span
                            key={t}
                            style={{
                              fontFamily: monoFont,
                              fontSize: 9.5,
                              letterSpacing: 1,
                              color: amber,
                              border: `1px solid ${amber}55`,
                              borderRadius: 2,
                              padding: "1px 6px",
                            }}
                          >
                            {t.toUpperCase()}
                          </span>
                        ))}
                      </div>
                    </div>
                    <div style={{ color: dim, marginTop: 2, marginBottom: 6 }}>{arch.description}</div>
                    {arch.supers && (
                      <div style={{ borderTop: "1px dashed #223546", paddingTop: 6 }}>
                        <div>
                          <span style={{ color: magenta }}>α SUPER — {arch.supers.alpha.name}:</span>{" "}
                          {arch.supers.alpha.effect}
                        </div>
                        <div style={{ marginTop: 4 }}>
                          <span style={{ color: cyan }}>Δ SUPER — {arch.supers.delta.name}:</span>{" "}
                          {arch.supers.delta.effect}
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </Panel>

            <Panel title="Rules Updates" glow="#8fd6ff" tag="1E PATCH'D UP — QUICK REFERENCE">
              {RULES_UPDATES.map((r) => (
                <div
                  key={r.title}
                  style={{
                    background: "#0a121d",
                    border: "1px solid #223546",
                    borderLeft: "3px solid #8fd6ff",
                    borderRadius: 3,
                    padding: "8px 12px",
                    marginBottom: 6,
                    fontSize: 12.5,
                    lineHeight: 1.55,
                  }}
                >
                  <b style={{ color: "#8fd6ff" }}>{r.title}</b>
                  <div style={{ color: "#c3dced" }}>{r.text}</div>
                </div>
              ))}
              <div style={{ fontSize: 11, color: dim, marginTop: 4 }}>
                For anything not covered here, the base Panic at the Dojo rulebook still applies.
              </div>
            </Panel>

            <Panel title="All Forms &amp; Skills" glow={cyan} tag="FEDERATION OPEN ARCHIVE — PUBLIC ACCESS">
              {GAME_DATA.forms.map((f) => (
                <div
                  key={f.name}
                  style={{
                    background: "#0a121d",
                    border: `1px solid #223546`,
                    borderRadius: 4,
                    padding: "10px 12px",
                    marginBottom: 8,
                    fontSize: 12.5,
                    lineHeight: 1.55,
                  }}
                >
                  <b style={{ color: cyan }}>{f.name}</b> <span style={{ color: dim }}>({f.alts})</span>
                  <div>{f.ability}</div>
                  {f.actions.map((a) => (
                    <div key={a.name}>
                      <b>{a.cost}: {a.name}</b> — {a.effect}
                    </div>
                  ))}
                  <div style={{ marginTop: 3, fontStyle: "italic", color: "#7dffa0" }}>Skill: {f.skill}</div>
                </div>
              ))}
            </Panel>
          </>
        )}

        {tab === "export" && (
          <>
            <Panel title="Export Controls" glow="#7dffa0" tag="TRANSMIT RECORD OFF-DEVICE">
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                <button onClick={downloadExport} style={linkBtnStyle("#7dffa0")}>
                  ⬇ DOWNLOAD .TXT
                </button>
                <button onClick={() => window.print()} style={linkBtnStyle(cyan)}>
                  🖨 PRINT / SAVE PDF
                </button>
              </div>
            </Panel>

            <div id="export-sheet">
              <Panel title="Hero Sheet" glow={amber} tag="FULL RECORD — ALL STANCES &amp; TOKENS">
                <div style={{ fontFamily: headFont, fontSize: 22, letterSpacing: 1.5, color: textMain, marginBottom: 2 }}>
                  {char.name || "UNNAMED HERO"}
                </div>
                <div style={{ fontFamily: monoFont, fontSize: 12, color: dim, marginBottom: 12 }}>
                  {char.player ? `PLAYER: ${char.player} · ` : ""}
                  {char.heroType.toUpperCase()} · {archetypesAvailable.join(" / ").toUpperCase()} · {char.hp}/{char.maxHp} HP
                </div>

                {activeAbilities.map((entry) => (
                  <div
                    key={entry.key}
                    style={{
                      background: "#0a121d",
                      border: `1px solid #2c3f52`,
                      borderLeft: `3px solid ${magenta}`,
                      borderRadius: 3,
                      padding: "8px 12px",
                      marginBottom: 8,
                      fontSize: 12.5,
                      lineHeight: 1.55,
                    }}
                  >
                    <b style={{ color: magenta }}>
                      {entryLabel(entry)} {entry.name.toUpperCase()}
                    </b>
                    <div style={{ color: "#c3dced" }}>{GAME_DATA.archetypes[entry.name][entry.tier]}</div>
                  </div>
                ))}

                <div style={{ fontFamily: headFont, fontSize: 12, letterSpacing: 2, color: amber, margin: "14px 0 8px" }}>
                  STANCES
                </div>
                {char.stances.slice(0, stanceCountForLevel(char.level)).map((s, i) => {
                  const form = formObjs[i];
                  if (!form) return null;
                  const stanceArchetype = resolveStanceArchetype(archetypesAvailable, s.archetype);
                  const styleObj = (GAME_DATA.styles[stanceArchetype] || []).find((x) => x.name === s.style);
                  const label = styleObj
                    ? `${styleObj.name.replace(" Style", "")} ${form.name.replace(" Form", "")}`
                    : form.name;
                  return (
                    <div
                      key={i}
                      style={{
                        background: "#0a121d",
                        border: `1px solid #223546`,
                        borderRadius: 4,
                        padding: "10px 12px",
                        marginBottom: 8,
                        fontSize: 12.5,
                        lineHeight: 1.55,
                      }}
                    >
                      <b style={{ color: amber }}>
                        STANCE {i + 1} — {label.toUpperCase()}
                      </b>
                      <div style={{ marginTop: 4 }}>
                        <span style={{ color: cyan }}>{form.name}</span> ({form.alts})
                        <div>{form.ability}</div>
                        {form.actions.map((a) => (
                          <div key={a.name}>
                            <b>{a.cost}: {a.name}</b> — {a.effect}
                          </div>
                        ))}
                        <div style={{ fontStyle: "italic", color: "#7dffa0" }}>Skill: {form.skill}</div>
                      </div>
                      {styleObj && (
                        <div style={{ marginTop: 6, borderTop: "1px dashed #223546", paddingTop: 6 }}>
                          <span style={{ color: magenta }}>
                            {styleObj.name} (Range {styleObj.range})
                          </span>
                          <div>{styleObj.ability}</div>
                        </div>
                      )}
                    </div>
                  );
                })}

                <div style={{ fontFamily: headFont, fontSize: 12, letterSpacing: 2, color: amber, margin: "14px 0 8px" }}>
                  SKILLS
                </div>
                <div style={{ fontSize: 12.5, lineHeight: 1.7, marginBottom: 14 }}>
                  {char.skills.map((sk, i) => (
                    <div key={i}>{i + 1}. {sk || formObjs[i]?.skill || "—"}</div>
                  ))}
                </div>

                <div style={{ fontFamily: headFont, fontSize: 12, letterSpacing: 2, color: amber, margin: "14px 0 8px" }}>
                  TOKENS ON HAND
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6, marginBottom: 14 }}>
                  {TOKEN_TYPES.map((t) => (
                    <div key={t.key} style={{ fontSize: 12.5, borderLeft: `3px solid ${t.color}`, paddingLeft: 8 }}>
                      {t.key}: <b>{char.tokens[t.key] || 0}</b>
                    </div>
                  ))}
                </div>

                {char.notes && (
                  <>
                    <div style={{ fontFamily: headFont, fontSize: 12, letterSpacing: 2, color: amber, margin: "14px 0 8px" }}>
                      FIELD NOTES
                    </div>
                    <div style={{ fontSize: 12.5, lineHeight: 1.6, whiteSpace: "pre-wrap" }}>{char.notes}</div>
                  </>
                )}
              </Panel>
            </div>
          </>
        )}

        <div
          style={{
            textAlign: "center",
            fontFamily: monoFont,
            fontSize: 9.5,
            letterSpacing: 2,
            color: "#3a4c5c",
            marginTop: 24,
          }}
        >
          — END TRANSMISSION · SIGNAL LOST BEYOND THE DARKMATTER VOID —
        </div>
      </div>
    </div>
  );
}

const linkBtnStyle = (color) => ({
  padding: "9px 12px",
  fontFamily: headFont,
  fontSize: 11.5,
  letterSpacing: 1,
  border: `1px solid ${color}`,
  borderRadius: 3,
  background: `${color}14`,
  color: color,
  cursor: "pointer",
  whiteSpace: "nowrap",
});

const hpBtnStyle = (color) => ({
  width: 34,
  height: 34,
  borderRadius: 3,
  border: `1px solid ${color}`,
  background: "#0a121d",
  color: color,
  fontSize: 17,
  fontWeight: 700,
  cursor: "pointer",
});

const tokBtnStyle = {
  width: 20,
  height: 20,
  borderRadius: 2,
  border: `1px solid #2c3f52`,
  background: "#111c29",
  color: textMain,
  fontSize: 12,
  fontWeight: 700,
  cursor: "pointer",
  lineHeight: 1,
};

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
