/* ---------------------------------------------------------------
   Storage adapter — uses Claude.ai's window.storage when this file
   is running as a Claude artifact, and falls back to plain
   localStorage when deployed standalone (e.g. on GitHub Pages).
--------------------------------------------------------------- */
const appStorage =
  typeof window !== "undefined" && window.storage
    ? window.storage
    : {
        async get(key) {
          const v = localStorage.getItem(key);
          if (v === null) throw new Error("not found");
          return { key, value: v };
        },
        async set(key, value) {
          localStorage.setItem(key, value);
          return { key, value };
        },
        async delete(key) {
          localStorage.removeItem(key);
          return { key, deleted: true };
        },
        async list(prefix = "") {
          const keys = Object.keys(localStorage).filter((k) => k.startsWith(prefix));
          return { keys };
        },
      };

enemies from attacking you. That's just smart. Inferno Blaster is a strong choice, turning Ignition from a zero sum game into a game stacked heavily in your favor. Inferno Shadow lets you stay within range of your enemies, so you can keep using Ignition every turn. Inferno Wild gets extra Action Dice from being on fire. Inferno Zen will heavily punish enemies who attack you. Be sure to Challenge someone so they have to.", "actions": [{"cost": "Gain 1 Burning Token", "name": "Ignition", "effect": "Give one Burning token to an enemy within range. Can only be used once per turn."}]}, {"name": "Phoenix Style", "range": "1", "ability": "Whenever you would take damage from Burning tokens or from Traps, you heal that much damage instead.", "actions": [{"cost": "4+", "name": "Cleansing Fire", "effect": "Choose two: Give a Burning token to someone within range; heal an ally within range; or place a Trap within range."}]}, {"name": "Volcanic Style", "range": "1-3", "ability": "After you spend Speed tokens on Free Movement, you may place a Trap into each space you exit. You do not take damage from entering a space with a Trap.", "actions": [{"cost": "4+", "name": "Pyroclasm", "effect": "Place three Traps within range. Each Trap placed by this Action must be adjacent to a Trap obstacle. The Volcanic Ability lets you move through Traps safely, but doesn't protect you from damage if you end your turn on one."}]}], "Gunkata": [{"name": "Akimbo Style", "range": "3-5", "ability": "After you deal damage to someone, you move one space.", "actions": [{"cost": "4+", "name": "Firing Wild", "effect": "Choose one: Deal 1 damage to every enemy and ally adjacent to you; or deal 1 damage to every enemy and ally within range. Akimbo's Ability does not give you a choice - if you deal damage, you must move one space. Firing Wild makes you move one space per enemy or ally damaged by it. Count up all the damage dealt before you move anywhere. Each space of movement is separate, so you may move back and forth over and over if you don't want to leave your spot. Akimbo One-Two doubles the damage of Firing Wild, and makes each of your Damage Actions move you one additional space. Akimbo Control can either have a large Range of 3-8, letting you hit"}]}, {"name": "Artillery Style", "range": "3-8", "ability": "You can see and target enemies through Fog and Walls.", "actions": [{"cost": "1+ or 6+", "name": "Bombardment", "effect": "Place a Trap into a space within range. 6+: Place a Trap into each space adjacent to the first Trap. Do not place these Traps over Edges or Walls."}]}, {"name": "Crosshair Style", "range": "4-8", "ability": "You ignore Armor and Shields when dealing damage. Weakness tokens you hold and Iron tokens your enemies hold do not reduce the damage you deal.", "actions": [{"cost": "1+", "name": "Take Aim", "effect": "Your next Action this turn has its cost and every number listed in its description increased by 1. Take Aim is especially powerful with Choice Actions and Tiered Actions, as it gives you much more from those Actions than normal."}]}, {"name": "Ricochet Style", "range": "2-4", "ability": "After you deal damage to an enemy with an Action, you may deal 1 damage to a different enemy within 3 spaces of them.", "actions": [{"cost": "3+", "name": "Trick Shot", "effect": "Choose one obstacle within range. Deal 2 damage to an enemy within 3 spaces of that obstacle. Both the Ricochet Ability and Trick Shot draw line of sight from the enemy that triggers the Ricochet, or the obstacle you chose with Trick Shot, instead of drawing from you. Trick Shot can shoot through Walls and Fog. If you choose a Wall or Fog as the targeted obstacle, any enemy within 3 spaces of the Wall or Fog is a legal target, even if you couldn't hit them normally."}]}, {"name": "Ten Thousand Style", "range": "2-3", "ability": "to your Action Dice.", "actions": [{"cost": "2+", "name": "Point Blank Shot", "effect": "Deal 1 damage to an adjacent enemy. Then, push them 1 space."}]}], "Phantom": [{"name": "Aura Style", "range": "1-3", "ability": "At the start of your turn, you gain a 3 point Shield. When an enemy within range damages or breaks a Shield, you may move that enemy one space. After a Shield within range breaks, you gain 1 Iron token.", "actions": [{"cost": "3 Basic Tokens", "name": "Shields Up", "effect": "An ally within range gains a 3 point Shield. You always count as an ally within range of your own Actions, so Shields Up can give yourself a Shield."}]}, {"name": "Crying Style", "range": "1-4", "ability": "At the start of your turn, give one Weakness token to all enemies within range. At the end of your turn, Challenge an enemy within range and give them one Weakness token.", "actions": [{"cost": "6+", "name": "Banshee's Wail", "effect": "All enemies within range gain a Weakness token. All Traps and Walls within range become Rubble."}]}, {"name": "Puppet's Style", "range": "1-5", "ability": "You may use Speed tokens to move any ally, enemy, or obstacle within range, using the normal Free Movement rules. Walls and Traps you move with this Ability become Rubble. Edges cannot be moved with this Ability.", "actions": [{"cost": "3+ or 5+", "name": "Pull The Strings", "effect": "Choose an enemy or ally you can see. Move them 3 spaces. 5+: Choose an enemy or ally you can see. Move them 3 spaces."}]}, {"name": "Spirit Style", "range": "1-3", "ability": "Edges cannot remove your Copies from play. You and your Copies can move over Walls as though they were empty space. After you use Free Movement on yourself or your Copy, you may move any number of your Copies one space.", "actions": [{"cost": "1+ or 3+ or 5+", "name": "Now You See Me\u2026", "effect": "Place a Copy into an empty space within range. 3+: Place a Copy into an empty space within range. 5+: Place a Copy into an empty space within range. Destroy 1 Copy: \u2026Now You Don't \u2026Now You Don't is a Token Action, but the Cost is one of your Copies. Teleport into the space of the destroyed Copy."}]}, {"name": "Vortex Style", "range": "1-3", "ability": "Edges cannot remove you from play. When you stand on an Edge, every other Edge counts as an adjacent space you can move to.", "actions": [{"cost": "4+", "name": "Black Hole", "effect": "Place an Edge into an empty space within range. The Vortex Ability only counts for movement, not Range. You cannot stand over any Edge and attack any enemy within Range 1-2 of every other Edge. You must move to them."}]}], "Punk": [{"name": "Bleeding Style", "range": "1", "ability": "You don't get Taken Out at zero HP. You can continue to fight as long as you remain in play. Your side still loses if everyone in play is at zero HP at the same time.  2 HP: Lash Out Lash Out is a Token Action that spends your HP. You can't spend HP you do not have.  Push an adjacent enemy two spaces.", "actions": [{"cost": "12+", "name": "I'm Still Here", "effect": "Deal 7 damage to an enemy within range. Then, push that enemy 7 spaces. I'm Still Here is nearly impossible to trigger without the Punk Ability. Switch to Bleeding Style after you get Taken Out and you can guarantee I'm Still Here will do some damage."}]}, {"name": "Brawling Style", "range": "1", "ability": "After your Shield breaks, you gain 1 Power token. After you deal damage, if you didn't spend a Power token on that hit, you gain 1 Power token.", "actions": [{"cost": "2 Power Tokens", "name": "Tough It Out", "effect": "You gain a 2 point Shield."}]}, {"name": "Flashy Style", "range": "1", "ability": "After you roll your Action Dice, you may combine two of your numbers into a single, larger number.", "actions": [{"cost": "X", "name": "Show Off", "effect": "Choose two of these Basic Actions: Movement, Damage, A Challenger Approaches, Put It Out!, or Throw. Perform both of those Actions as if you had spent X on them. You can only use Show Off once per turn. The Flashy Ability combines two numbers into one, effectively removing one from your Action Pool. For example, if you combine a 3 and a 4, you gain a 7, but lose both the 3 and the 4."}]}, {"name": "Knockdown Style", "range": "1", "ability": "After you take damage from an enemy, you deal 1 damage back to them.", "actions": [{"cost": "4+", "name": "Take It On The Chin", "effect": "Each enemy within range deals 1 damage to you. Then, you deal 3 damage to one of them. If you use Armor or Iron Tokens to reduce the damage you take to zero, the Knockdown Ability does not trigger. If an enemy hits you twice with One-Two's Ability, Knockdown's Ability will also hit them twice."}]}, {"name": "Taunting Style", "range": "1", "ability": "After you take damage, you gain 1 Iron token. After you take damage from an enemy with your Challenge, you may move one space.", "actions": [{"cost": "1+", "name": "Is That All You Got?", "effect": "Challenge an enemy you can see. You gain 1 Iron token. X: Not Good Enough Give X - 2 Weakness tokens to an enemy with your Challenge. Then, they discard your Challenge. Not Good Enough gives out two less Weakness tokens than the number you spent on it. For example, if you spend a 9 to use Not Good Enough, you give them seven Weakness tokens. Spending a 1 or a 2 will give them zero Weakness tokens."}]}], "Teacher": [{"name": "Patient Style", "range": "1", "ability": "At the end of your turn, your Speed tokens become Iron tokens. You may only take one Action per turn. Your Action Pool does not empty between Turns or Rounds.", "actions": [{"cost": "X", "name": "Waiting Game", "effect": "Add X+1 to your Action Pool. Then, you may move one space. You can only use Waiting Game during enemy turns. Waiting Game gives you a number one higher than the number you spent to use Waiting Game."}]}, {"name": "Elder Style", "range": "1-2", "ability": "The cost of this Stance's Unique Actions are reduced by 1 (to a minimum of 1+ or 2 tokens). Once per turn, during your turn, you may use any Unique Action you know, from among all of your Stances, for free. It does not cost any tokens or numbers to use. If your free Action is a Tiered Action, you perform it as if you spent a 7. Elder Style is a strange beast. It pairs well with any Form, but it also pairs with every other Form and Style you have, due to its Ability. Elder Style likes Forms with good Unique Actions it can use for free. Some of the best are Blaster Form's Amplify, Iron Form's Protect, Power Form's Crush, and Song Form's Sing Along. You do not need to pair Elder Style with these Forms to use these Actions. You just need to have these Forms among your Stances. Elder Shadow only needs 2 Speed tokens to use Stunt, letting you teleport all over while leaving obstacles everywhere. An Amplified Stunt will place four obstacles into adjacent spaces. Elder Reversal is so ineffective I have to warn against it. Elder's cost reduction does nothing for Counter Attack, and the Elder Ability to use a surprise Unique Action once during your turn is heavily limited by the Reversal Ability's once per turn Action limit.", "actions": []}, {"name": "Mastermind Style", "range": "No", "ability": "You cannot perform Actions. Instead, you spend your numbers on your allies, making them perform Actions for you. Each Action you take uses an ally's current location, range, and Stance bonuses as if they'd taken that Action themselves. You can only give Actions to allies you can see. After each Action an ally performs during your turn, you may move 1 space. Mastermind Style directs your allies, deciding what they do for them. Be wary of Mastermind One-Two, Mastermind Power, and Mastermind Zen. Their Abilities do nothing when you can't take Actions. Mastermind Vigilance can do its job much easier when you can make your allies Weaken enemies themselves, without putting yourself in harm's way. Mastermind Reversal can donate Actions to your allies exactly when they need them most, making a full-team Reversal Form. Mastermind Iron has Armor and a downside that doesn't matter if you don't need to go anywhere.", "actions": []}, {"name": "Motivating Style", "range": "1-2", "ability": "At the end of your turn, allies within range heal, and you gain an Inspired token.", "actions": [{"cost": "4+", "name": "You Can Do It!", "effect": "Choose an ally within range. They choose two: They heal; they move two spaces; they gain a copy of a token they hold; or they discard one token they hold. The Inspired token you gain from the Motivating Ability is the same as the one used for the Teacher Ability."}]}, {"name": "Training Style", "range": "1", "ability": "At the end of your turn, give an ally one Training token. Training Token: Before performing an Action, you may spend a Training token to increase all numbers listed in that Action by 1, including its cost. You may only spend 1 Training token per turn.", "actions": [{"cost": "3+", "name": "Watch Closely", "effect": "You gain one Training Token. If you spend it before the end of this turn, give one Training Token to an ally. When you use a Training Token, pay close attention to the wording of the modified Action. Actions that say \"target one enemy\" will now say \"target two enemies,\" while Actions that say \"an enemy\" or \"an ally\" will still have only one target. For example, the basic Damage Action deals damage to two targets, and deals one more damage to both of them. The basic Grapple or Throw Actions, however, are unchanged by Training Tokens."}]}], "Trickster": [{"name": "Caged Style", "range": "1", "ability": "Adjacent enemies cannot gain or spend Speed tokens.", "actions": [{"cost": "2+", "name": "Welcome To My Maze", "effect": "Deal 1 damage to one enemy outside of your Range. Then, pull them three spaces."}]}, {"name": "Mysterious Style", "range": "1-2", "ability": "At the start of your turn, place a Fog obstacle into your space. While you stand in Fog, your maximum range is doubled.  3 Speed or Iron Tokens: Ghost Walk Place a Fog obstacle into an empty space within range. Then, teleport to a Fog obstacle within range. The Mysterious Ability replaces an obstacle in your space with Fog. You can pay for Ghost Walk with any quantity of each token, as long as you spend a total of 3 tokens. 3 Speed, 2 Speed and 1 Iron, 2 Iron and 1 Speed, and 3 Iron tokens are all legal costs to pay for Ghost Walk. Mysterious Style strikes from hiding, using Fog to be untouchable. Mysterious Control increases your range, letting you attack, control, and Ghost Walk across the whole map. Mysterious Blaster also increases your range, while also letting Ghost Walk place additional Fog and giving you access to Shockwave. While standing in Fog, an Amplified Shockwave has Range: 1-10. Mysterious Shadow and Mysterious Reversal keep their Speed tokens between turns, letting you Ghost Walk to escape harm. Mysterious Iron can Ghost Walk to make up for Iron Form's lack of maneuverability, while also gaining Iron tokens for Trickster Abilities.", "actions": [{"cost": "3 Speed or Iron Tokens", "name": "Ghost Walk", "effect": "Place a Fog obstacle into an empty space within range. Then, teleport to a Fog obstacle within range. Payable with any mix of Speed and Iron tokens totaling 3."}]}, {"name": "Illusion Style", "range": "1-3", "ability": "After an enemy deals damage to you while within range of at least one of your Copies, you deal 1 damage to them. If they are within range of three or more Copies, you deal 2 damage to them instead. You may spend your Copies as Iron tokens.", "actions": [{"cost": "3+ or 6+", "name": "Where Are You Looking?", "effect": "Place 2 Copies into empty spaces within range. 6+: Place 2 more Copies into empty spaces within range."}]}, {"name": "Hidden Style", "range": "1-3", "ability": "You may move through Walls as though they were empty spaces. You can see and target enemies through Walls.  3 Iron tokens: Sudden Strike Deal 2 damage to an enemy within range. The Hidden Ability lets you stand in Walls. A Wall you are standing in does not block line of sight to you. Hidden Style is a defense oriented Style, but is generically useful with any Form you want to pair it with. Hidden Iron and Hidden Song have the Iron tokens you need for Sudden Strike. Hidden Reversal and Hidden Shadow can escape from enemies by going through the walls.", "actions": [{"cost": "3 Iron Tokens", "name": "Sudden Strike", "effect": "Deal 2 damage to an enemy within range."}]}, {"name": "Whip Style", "range": "2-5", "ability": "Your Throw Actions target one person within range. When you Throw or Grapple an enemy, they take 2 damage.", "actions": [{"cost": "5+", "name": "Grapple Hook", "effect": "Teleport to any empty space within range. The Whip Ability prevents you from Throwing adjacent enemies."}]}], "Underdog": [{"name": "Collateral Style", "range": "1-2", "ability": "After you destroy an obstacle, you gain one Basic token of your choice.", "actions": [{"cost": "3+", "name": "Roughhousing", "effect": "Destroy an obstacle within range, then choose one: Teleport to that obstacle's space; deal 1 damage to each enemy adjacent to the destroyed obstacle; or destroy another obstacle within range. You can spend 2 Basic Tokens to choose a second option from the list, or 3 Basic Tokens to choose all three."}]}, {"name": "Distracting Style", "range": "1-2", "ability": "After an enemy deals damage to you, if they have no Weakness tokens, give that enemy one Weakness token.  1+ or 2 Basic Tokens: Flare Flare can be used as either a Simple or Token Action. Move one space, then give one Weakness token to one enemy within range. Distracting Style makes you the perfect distraction. Hard to catch and hard to hit, you can outlast all but the most aggressive assaults. Be sure to Challenge your enemies, so the distraction works! Distracting Shadow is an incredibly elusive Stance, able to move constantly with Flares and Stunts during your enemies' turns. Distracting Iron and Distracting Zen let you survive the attention, giving your Armor or Shields to block some damage. Distracting Reversal is the halfway point between Iron and Shadow, giving you the reactions of Shadow and the Armor of Iron. Distracting Vigilance is a solid recovery Stance. Rather than Challenge your enemies and force them to take Weakness tokens, this Stance uses its Ability as a threat, a way to punish attackers who come after you while you try to heal.", "actions": [{"cost": "1+ or 2 Basic Tokens", "name": "Flare", "effect": "Usable as either a Simple or Token Action. Move one space, then give one Weakness token to one enemy within range."}]}, {"name": "Eye of the Style", "range": "1", "ability": "At the start of your turn, you gain a Bonus of your choice.", "actions": [{"cost": "3+", "name": "Thrill of the Fight", "effect": "Target an adjacent enemy, then choose one: Challenge them; you deal 2 damage to them; or give them 2 Burning tokens. You can spend 2 Basic Tokens to choose a second option from the list, or 3 Basic Tokens to choose all three. The Bonuses are on page 20."}]}, {"name": "Lucky Style", "range": "1", "ability": "You have Armor. Adds a die to your Action Dice (exact die size is a graphic in the source PDF and didn't extract as text).", "actions": [{"cost": "3+", "name": "Just What I Needed", "effect": "Choose one: You gain 2 Basic tokens; you teleport two or three spaces; or you heal. You can spend 2 Basic Token to choose a second option from the list, or 3 Basic Tokens to choose all three."}]}, {"name": "Misfortune's Style", "range": "1-3", "ability": "When you would take damage from a Trap, deal that damage to an enemy within range instead. If no enemies are within range, gain one Power token instead.  1+ or 3 Basic Tokens: Bad Luck Bad Luck can be used as either a Simple or Token Action. Place a Trap into a space within range. Misfortune's Style turns your bad luck around, filling the terrain with Traps while becoming immune to them yourself. Misfortune's Shadow lets you keep your enemies close, while also giving you Stunt as another means of placing Traps. Misfortune's Zen combines both Abilities to pile on the 1 damage reactions. Death by a thousand cuts. Misfortune's Control increases your range, making Bad Luck even easier to spread around. In addition, Control Tokens extend your ability to share misfortune and stop your enemies from doing as they please.", "actions": [{"cost": "1+ or 3 Basic Tokens", "name": "Bad Luck", "effect": "Usable as either a Simple or Token Action. Place a Trap into a space within range."}]}], "Wardancer": [{"name": "Forbidden Style", "range": "1-2", "ability": "At the start of your turn, you take 2 damage. This damage cannot drop you below 1 HP on your current Health Bar. This Style is attached to two Forms. You have the Abilities and Unique Actions from each Form. Do not use the Action Dice listed in those Forms. This Stance's Action Dice are determined by combining the results of the following chart: Blaster:  Reversal:  Control:  Shadow:  Dance: Iron:  Song: Vigilance:  One-Two:  Wild:  Power:  Zen:  Forbidden Style lets you combine two Forms into a single Stance. This makes it the most open-ended Style in the game. You only get one Skill from a Forbidden Stance. You can choose which Form you take that Skill from. If you want damage, Forbidden Power Blaster or Forbidden Blaster One-Two double down on damage increasing Abilities. Combining Shadow or Dance with any other Form makes that Form highly mobile, so Iron, Power, Wild, and Zen appreciate these pairs. If you want maximum defense, combine Iron, Reversal, Vigilance, and Zen Forms in any way you please. Forbidden One-Two Wild turns every 2 Basic tokens you hold into 2 damage. Spend everything on Movement, and destroy them with One-Two Fury.", "actions": []}, {"name": "Lightning Style", "range": "1", "ability": "After you deal damage, you gain 1 Speed token.", "actions": [{"cost": "2+ or 5+ or 8+", "name": "Deadly Dance", "effect": "Teleport 2 spaces. Deal 1 damage to an enemy within range. 5+: Teleport 2 spaces. Deal 2 damage to an enemy within range. 8+: Teleport 2 spaces. Deal 2 damage to an enemy within range."}]}, {"name": "Overwhelming Style", "range": "1", "ability": "You ignore Armor when dealing damage. When an enemy hits you with an Action, you may spend a Power token to deal 1 damage to them and push them 1 space.", "actions": [{"cost": "4+ or 8+", "name": "Power Strike", "effect": "Deal 2 damage to an enemy within range. You gain 2 Power tokens. 8+: Deal 4 damage and gain 4 Power tokens instead."}]}, {"name": "Relentless Style", "range": "1", "ability": "When you deal damage to an enemy, immediately push them one space and then move into the empty space they left. If you damage multiple enemies at the same time, push all of them one space, then move into one of the empty spaces they left.", "actions": [{"cost": "3+ or 5+ or 7+", "name": "Rush Down", "effect": "Deal 1 damage to an enemy within range. Then, deal 1 damage to an enemy within range. 5+: Then, deal 1 damage to an enemy within range. 7+: Then, deal 1 damage to an enemy within range. The Relentless Ability requires you to move into their space if you can, even if you do not want to. If they are standing in a full space (such as a Wall) due to an Ability, you do not move into that space."}]}, {"name": "Weightless Style", "range": "1", "ability": "All spaces are Empty spaces to you. Edges cannot remove you from play. Rubble does not make you discard Speed tokens. Traps deal no damage to you.", "actions": [{"cost": "4+ or 7+", "name": "Effortless", "effect": "Teleport to any space you can see. 7+: Choose an ally. They may teleport to any space they can see."}]}], "Winterblossom": [{"name": "Crystal Style", "range": "1-2", "ability": "When one of your Copies is destroyed, it deals 1 damage to every enemy adjacent to it.", "actions": [{"cost": "3+ or 6+", "name": "Splinter", "effect": "Place a Copy of you into any space within range. Then, deal 1 damage to every enemy adjacent to that Copy. 6+: Also place a second Copy of you into any space within range, and deal 1 damage to every enemy adjacent to it."}, {"cost": "Free", "name": "Shatter", "effect": "A Token Action that costs nothing. Destroy one of your Copies. Give one Weakness token to an enemy that was within range of that Copy."}]}, {"name": "Frozen Style", "range": "1", "ability": "After an enemy moves into an empty space adjacent to you, you may give them one Weakness token.", "actions": [{"cost": "3+", "name": "Exploit Weakness", "effect": "Choose one enemy within range. Give them one Weakness token and deal 2 damage to them. The Frozen Ability triggers each time an enemy moves into a space adjacent to you, even if they are moving around you or passing through."}]}, {"name": "Precision Style", "range": "1-2", "ability": "Your Actions deal +1 damage to enemies with Armor or Shields. When you target an enemy with an Action, they must discard 1 Iron token.  3+ and 3+: Perfect Strike This Action costs two numbers to perform.  Deal 4 damage to an enemy within range. This damage cannot be reduced by Armor and ignores Shields. Tokens and Abilities cannot be used in response to Perfect Strike. The Precision Ability adds only +1 damage, even against an enemy with both Armor and a Shield. Precision Style punishes defensive strategies, crashing straight through their Shields and Armor. Precision Blaster lets Perfect Strike hit multiple foes, making up for its multiple-number cost. Precision Shadow and Precision Wild both have the most Action Dice, giving you more opportunities for Perfect Strikes. Precision Zen can Perfect Strike and 7+ Focus every turn. Precision Power combines their Abilities to deal massive damage regardless of your opponent's defenses.", "actions": [{"cost": "3+ and 3+", "name": "Perfect Strike", "effect": "Costs two separate numbers to perform. Deal 4 damage to an enemy within range. This damage cannot be reduced by Armor and ignores Shields. Tokens and Abilities cannot be used in response."}]}, {"name": "Pressure Style", "range": "1-2", "ability": "At the start of your turn, give one Weakness token to every enemy within range.", "actions": [{"cost": "5+", "name": "Apply Pressure", "effect": "Choose one enemy within range. Deal damage to them equal to the number of tokens they hold. You can only use Apply Pressure once per turn."}]}, {"name": "Reflected Style", "range": "2-3", "ability": "At the start of your turn, you may place up to three Walls into empty adjacent spaces. You can see and target enemies through Walls.", "actions": [{"cost": "3+", "name": "Walled In", "effect": "Place 3 Walls into empty spaces within Range 1-3."}, {"cost": "3+", "name": "Icicle Fall", "effect": "Deal 1 damage to each enemy adjacent to any Walls."}]}]}};

const ARCHETYPE_NAMES = Object.keys(GAME_DATA.archetypes);

// Flat lookup of every Style by name, regardless of which (hero) Archetype it
// belongs to — Boss Archetypes reference Styles across the whole book.
const STYLE_BY_NAME = {};
Object.values(GAME_DATA.styles).forEach((list) => {
  list.forEach((s) => {
    STYLE_BY_NAME[s.name] = s;
  });

function stanceCountForLevel(level) {
  return Math.min(7, 3 + Math.floor((level - 1) / 2));
}
function superMoveSlotsForLevel(level) {
  return level >= 6 ? 2 : level >= 2 ? 1 : 0;
}
function rowForLevel(level) {
  return ADVANCEMENT_TABLE.find((r) => r.level === level) || ADVANCEMENT_TABLE[0];
}

/* ---------- Level 4 Fused Archetype / Level 8 Improved Archetype resolution ---------- */
// Returns every currently-active Archetype Ability entry: { key, name, tier }.
// tier is 'focused' | 'fused' | 'frantic', matching keys in GAME_DATA.archetypes[name].
function activeArchetypeEntries(char) {
  const lvl = char.level || 1;
  let list = [];

  if (char.heroType === "Focused") {
    list.push({ key: "core-1", name: char.archetype1, tier: "focused" });
  } else if (char.heroType === "Fused") {
    list.push({ key: "core-1", name: char.archetype1, tier: "fused" });
    list.push({ key: "core-2", name: char.archetype2, tier: "fused" });
  } else {
    list.push({ key: "core-1", name: char.archetype1, tier: "frantic" });
    list.push({ key: "core-2", name: char.archetype2, tier: "frantic" });
    list.push({ key: "core-3", name: char.archetype3, tier: "frantic" });
  }

  if (lvl >= 4 && char.bonusArchetype) {
    list.push({ key: "bonus", name: char.bonusArchetype, tier: "fused" });
  }

  if (lvl >= 8) {
    if (char.heroType === "Fused" && char.improvedArchetype) {
      list = list.map((e) =>
        e.key !== "bonus" && e.name === char.improvedArchetype ? { ...e, tier: "focused" } : e
      );
    } else if (char.heroType === "Frantic") {
      if (char.level8Choice === "upgradeBonus" && char.bonusArchetype) {
        list = list.map((e) => (e.key === "bonus" ? { ...e, tier: "focused" } : e));
      } else if (char.level8Choice === "newFused" && char.secondBonusArchetype) {
        list.push({ key: "bonus2", name: char.secondBonusArchetype, tier: "fused" });
      }
    } else if (char.heroType === "Focused") {
      if (char.level8Choice === "upgradeBonus" && char.bonusArchetype) {
        list = list.map((e) => (e.key === "bonus" ? { ...e, tier: "focused" } : e));
      } else if (char.level8Choice === "stackFocused") {
        list.push({ key: "stacked", name: char.archetype1, tier: "fused" });
      }
    }
  }

  return list.filter((e) => e.name);
}

// Only the archetypes actually chosen via Hero Type (ignores unused archetype2/3 fields for Focused, etc.)
function coreArchetypeNames(char) {
  if (char.heroType === "Focused") return [char.archetype1];
  if (char.heroType === "Fused") return [char.archetype1, char.archetype2];
  return [char.archetype1, char.archetype2, char.archetype3];
}

// Deduped archetype names whose Styles can currently be picked for a Stance.
function styleArchetypeNames(char) {
  const names = [];
  activeArchetypeEntries(char).forEach((e) => {
    if (!names.includes(e.name)) names.push(e.name);
  });
  return names;
}

function entryLabel(entry, isCore) {
  if (entry.key === "bonus" || entry.key === "bonus2") return `${entry.tier.toUpperCase()} · BONUS ARCHETYPE`;
  if (entry.key === "stacked") return "FUSED · STACKED";
  return entry.tier.toUpperCase();
}

// Given the list of currently-available archetype names and a stance's stored
// archetype choice, resolve which archetype actually applies (falls back
// sensibly if there's only one option, or the stored choice is now stale).
function resolveStanceArchetype(names, stanceArchetype) {
  if (!names || names.length === 0) return stanceArchetype;
  if (names.length === 1) return names[0];
  return names.includes(stanceArchetype) ? stanceArchetype : names[0];
}

   site keeps its own surrounding chrome. Pulling this out once means a data

   and the GM Toolkit enemy builder. */
function Toast({ message }) {
  if (!message) return null;
  const isError = /FAILED|ERROR|NOT FOUND/.test(message);
  const tone = isError ? danger : actionGreen;
  return (
    <div
      style={{
        position: "fixed",
        bottom: 20,
        left: "50%",
        transform: "translateX(-50%)",
        zIndex: 1000,
        background: "#150f1a",
        border: `2px solid ${tone}`,
        borderRadius: 3,
        padding: "10px 18px",
        boxShadow: `0 4px 24px -6px ${tone}88`,
        fontFamily: monoFont,
        fontSize: 12.5,
        color: textMain,
        maxWidth: "90vw",
        letterSpacing: 0.5,
        pointerEvents: "none",
      }}
    >
      <span style={{ color: tone, fontWeight: 700 }}>{isError ? "⚠ " : "✓ "}</span>
      {message}
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error("Panic at the Dojo crashed:", error, info);
  }
  render() {
    if (this.state.error) {
      return (
        <div
          style={{
            minHeight: "100vh",
            background: "#08070a",
            color: "#f2ecf5",
            fontFamily: "'Share Tech Mono', monospace",
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            padding: 24,
          }}
        >
          <div
            style={{
              maxWidth: 480,
              border: "2px solid #ff4d5e",
              borderRadius: 4,
              padding: 24,
              background: "#191320",
              textAlign: "center",
            }}
          >
            <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 22, color: "#ff4d5e", letterSpacing: 1, marginBottom: 10 }}>
              SOMETHING BROKE
            </div>
            <div style={{ fontSize: 13, color: "#cdbfd6", lineHeight: 1.6, marginBottom: 16 }}>
              The tool hit an unexpected error and can't keep going in this state. Your saved heroes and
              enemies are untouched — try starting a fresh sheet, or reload the page.
            </div>
            <div style={{ fontSize: 11, color: "#8a7f8f", marginBottom: 16, fontFamily: "monospace", wordBreak: "break-word" }}>
              {String(this.state.error && this.state.error.message ? this.state.error.message : this.state.error)}
            </div>
            <button
              onClick={() => this.setState({ error: null })}
              style={{
                fontFamily: "'Bebas Neue', sans-serif",
                letterSpacing: 1,
                fontSize: 14,
                padding: "10px 20px",
                border: "2px solid #ff4d5e",
                background: "#ff4d5e22",
                color: "#f2ecf5",
                cursor: "pointer",
                borderRadius: 3,
              }}
            >
              TRY TO RECOVER
            </button>
          </div>
        </div>
      );
    }
    return this.props.children;
  }
}

    setChar((c) => ({
      ...c,
      tokens: { ...c.tokens, [type]: Math.max(0, (c.tokens[type] || 0) + delta) },

  function buildExportText() {
    const lines = [];
    lines.push("=".repeat(48));
    lines.push(`PANIC AT THE DOJO — HERO RECORD`);
    lines.push(`VARA SPIRAL NETWORK · OMEGA QUADRANT RELAY`);
    lines.push("=".repeat(48));
    lines.push("");
    lines.push(`NAME:      ${char.name || "Unnamed Hero"}`);
    lines.push(`PLAYER:    ${char.player || "—"}`);
    lines.push(`HERO TYPE: ${char.heroType}`);
    lines.push(`ARCHETYPES: ${archetypesAvailable.join(", ")}`);
    lines.push(`HP:        ${char.hp} / ${char.maxHp}`);
    lines.push("");
    activeAbilities.forEach((entry) => {
      lines.push(`[${entry.tier.toUpperCase()} ${entry.name.toUpperCase()}]`);
      lines.push(GAME_DATA.archetypes[entry.name][entry.tier]);
      lines.push("");
    });
    lines.push("-".repeat(48));
    lines.push("STANCES");
    lines.push("-".repeat(48));
    char.stances.slice(0, stanceCountForLevel(char.level)).forEach((s, i) => {
      const form = formObjs[i];
      if (!form) return;
      const stanceArchetype = resolveStanceArchetype(archetypesAvailable, s.archetype);
      const styleObj = (GAME_DATA.styles[stanceArchetype] || []).find((x) => x.name === s.style);
      const label = styleObj ? `${styleObj.name.replace(" Style", "")} ${form.name.replace(" Form", "")}` : form.name;
      lines.push("");
      lines.push(`STANCE ${i + 1}: ${label}`);
      lines.push(`  Form: ${form.name} (${form.alts})`);
      lines.push(`    ${form.ability}`);
      form.actions.forEach((a) => lines.push(`    ${a.cost}: ${a.name} — ${a.effect}`));
      lines.push(`    Skill: ${form.skill}`);
      if (styleObj) {
        lines.push(`  Style: ${styleObj.name} (Range ${styleObj.range})`);
        lines.push(`    ${styleObj.ability}`);
        (styleObj.actions || []).forEach((a) => lines.push(`    ${a.cost}: ${a.name} — ${a.effect}`));
      } else {
        lines.push(`  Style: — not selected —`);
      }
    });
    lines.push("");
    lines.push("-".repeat(48));
    lines.push("SKILLS");
    lines.push("-".repeat(48));
    char.skills.forEach((sk, i) => {
      lines.push(`  ${i + 1}. ${sk || formObjs[i]?.skill || "—"}`);
    });
    lines.push("");
    lines.push("-".repeat(48));
    lines.push("TOKENS ON HAND");
    lines.push("-".repeat(48));
    TOKEN_TYPES.forEach((t) => lines.push(`  ${t.key}: ${char.tokens[t.key] || 0}`));
    if (char.notes) {
      lines.push("");
      lines.push("-".repeat(48));
      lines.push("FIELD NOTES");
      lines.push("-".repeat(48));
      lines.push(char.notes);
    }
    lines.push("");
    lines.push("=".repeat(48));
    lines.push("END TRANSMISSION");
    lines.push("=".repeat(48));
    return lines.join("\n");
  }

                      const v = Math.max(2, Math.min(5, parseInt(e.target.value) || 2));
                      updateEnemy({ healthBarsTotal: v, barsRemaining: v });
                    }}
                  />
                  <div style={{ fontSize: 11, color: dim, marginTop: 4 }}>
                    {enemy.healthBarsTotal} Units · {enemy.healthBarsTotal} turns per Round
                  </div>
                </Field>
              )}

              <div style={{ fontFamily: headFont, fontSize: 12, letterSpacing: 1.5, color: cyan, margin: "12px 0 8px" }}>
                STANCE{enemyStanceCount(enemy.type) > 1 ? "S" : ""}
              </div>
              {Array.from({ length: enemyStanceCount(enemy.type) }, (_, i) => i).map((i) => {
                const stance = enemy.stances[i];
                const styleObj = STYLE_BY_NAME[stance.style];
                const formObj = GAME_DATA.forms.find((f) => f.name === stance.form);
                return (
                  <div
                    key={i}
                    style={{
                      border: "1px solid #223546",
                      borderRadius: 4,
                      padding: 10,
                      marginBottom: 10,
                      background: "#0a121d",
                    }}
                  >
                    <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8, marginBottom: 6 }}>
                      <Field label="Form">
                        <select
                          style={selectStyle}
                          value={stance.form}
                          onChange={(e) => {
                            const stances = enemy.stances.map((s, idx) =>
                              idx === i ? { ...s, form: e.target.value } : s
                            );
                            updateEnemy({ stances });
                          }}
                        >
                          {GAME_DATA.forms.map((f) => (
                            <option key={f.name} value={f.name}>
                              {f.name}
                            </option>
                          ))}
                        </select>
                      </Field>
                      <Field label="Style (any)">
                        <select
                          style={selectStyle}
                          value={stance.style}
                          onChange={(e) => {
                            const stances = enemy.stances.map((s, idx) =>
                              idx === i ? { ...s, style: e.target.value } : s
                            );
                            updateEnemy({ stances });
                          }}
                        >
                          <option value="">— choose —</option>
                          {ALL_STYLES_FLAT.map((s) => (
                            <option key={s.name} value={s.name}>
                              {s.name}
                            </option>
                          ))}
                        </select>
                      </Field>
                    </div>
                    {formObj && (
                      <div style={{ fontSize: 11.5, color: dim, lineHeight: 1.5 }}>
                        <FormDetail form={formObj} />
                      </div>
                    )}
                    {styleObj && (
                      <div style={{ fontSize: 11.5, color: dim, lineHeight: 1.5, marginTop: 3 }}>
                        <StyleDetail style={styleObj} />
                      </div>
                    )}
                  </div>
                );
              })}

              {enemy.type === "Boss" && (
                <Field label="4th Skill (custom, e.g. 'Ruthless Socialite')">
                  <input
                    style={inputStyle}
                    value={enemy.customSkill}
                    onChange={(e) => updateEnemy({ customSkill: e.target.value })}
                    placeholder="Two-word profession & attitude"
                  />
                </Field>
              )}

              {enemy.type !== "Stooge" && (
                <div style={{ fontSize: 11, color: dim, lineHeight: 1.5, marginTop: 6 }}>
                  Skills: {Array.from({ length: enemyStanceCount(enemy.type) }, (_, i) => i)
                    .map((i) => GAME_DATA.forms.find((f) => f.name === enemy.stances[i]?.form)?.skill.split(" — ")[0])
                    .filter(Boolean)
                    .join(", ")}
                  {enemy.type === "Boss" && enemy.customSkill ? `, ${enemy.customSkill}` : ""}
                </div>
              )}
            </Panel>

            <Panel title="Unit Tracker" tag="LIVE COMBAT READOUT" glow={enemyHpColor}>
              {enemy.superMove && !enemy.archetypeIsBoss && GAME_DATA.archetypes[enemy.archetype]?.supers && (
                <div
                  style={{
                    background: "#0a121d",
                    border: "1px solid #2c3f52",
                    borderLeft: `3px solid ${enemy.superMove === "alpha" ? superPink : superTeal}`,
                    borderRadius: 3,
                    padding: "8px 12px",
                    marginBottom: 12,
                    fontSize: 12.5,
                    lineHeight: 1.55,
                  }}
                >
                  <b style={{ color: enemy.superMove === "alpha" ? superPink : superTeal }}>
                    {enemy.superMove === "alpha" ? "α" : "Δ"}{" "}
                    {GAME_DATA.archetypes[enemy.archetype].supers[enemy.superMove].name}
                  </b>
                  <div style={{ color: "#c3dced" }}>
                    {GAME_DATA.archetypes[enemy.archetype].supers[enemy.superMove].effect}
                  </div>
                </div>
              )}
              <Field label="Cinematic Weight">
                <select
                  style={selectStyle}
                  value={enemy.cinematicWeight}
                  onChange={(e) => {
                    const w = CINEMATIC_WEIGHTS.find((x) => x.name === e.target.value);
                    updateEnemy({ cinematicWeight: e.target.value, maxHp: w.hp, hp: w.hp });
                  }}
                >
                  {CINEMATIC_WEIGHTS.map((w) => (
                    <option key={w.name} value={w.name}>
                      {w.name} — {w.hp} HP
                    </option>
                  ))}
                </select>
              </Field>

              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 10 }}>
                <button className="tok-btn" onClick={() => updateEnemy({ hp: Math.max(0, enemy.hp - 1) })} style={hpBtnStyle(enemyHpColor)}>
                  −
                </button>
                <div style={{ flex: 1 }}>
                  <div style={{ display: "flex", gap: 3, height: 22 }}>
                    {Array.from({ length: enemy.maxHp }).map((_, idx) => (
                      <div
                        key={idx}
                        style={{
                          flex: 1,
                          background: idx < enemy.hp ? enemyHpColor : "#111c29",
                          border: `1px solid ${idx < enemy.hp ? enemyHpColor : "#22364a"}`,
                        }}
                      />
                    ))}
                  </div>
                  <div style={{ textAlign: "center", fontFamily: headFont, fontWeight: 700, marginTop: 6, color: enemyHpColor }}>
                    {enemy.hp} / {enemy.maxHp} HP — BAR {enemy.healthBarsTotal - enemy.barsRemaining + 1} OF {enemy.healthBarsTotal}
                  </div>
                </div>
                <button
                  className="tok-btn"
                  onClick={() => updateEnemy({ hp: Math.min(enemy.maxHp, enemy.hp + 1) })}
                  style={hpBtnStyle(enemyHpColor)}
                >
                  +
                </button>
              </div>

              <button
                onClick={() => {
                  if (enemy.barsRemaining > 1) {
                    updateEnemy({ barsRemaining: enemy.barsRemaining - 1, hp: enemy.maxHp });
                  }
                }}
                disabled={enemy.barsRemaining <= 1}
                style={{ ...linkBtnStyle(danger), width: "100%", marginBottom: 10, opacity: enemy.barsRemaining <= 1 ? 0.4 : 1 }}
              >
                HEALTH BAR BROKEN → NEXT BAR
              </button>

              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                {TOKEN_TYPES.map((t) => (
                  <div
                    key={t.key}
                    style={{
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "space-between",
                      background: "#0a121d",
                      border: "1px solid #223546",
                      borderLeft: `3px solid ${t.color}`,
                      borderRadius: 3,
                      padding: "8px 10px",
                    }}
                  >
                    <span style={{ fontFamily: headFont, fontSize: 12, letterSpacing: 1, color: t.color }}>
                      {t.key.toUpperCase()}
                    </span>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <button
                        className="tok-btn"
                        onClick={() =>
                          updateEnemy({ tokens: { ...enemy.tokens, [t.key]: Math.max(0, (enemy.tokens[t.key] || 0) - 1) } })
                        }
                        style={tokBtnStyle}
                      >
                        −
                      </button>
                      <span style={{ minWidth: 18, textAlign: "center", fontFamily: monoFont, fontWeight: 700 }}>
                        {enemy.tokens[t.key] || 0}
                      </span>
                      <button
                        className="tok-btn"
                        onClick={() => updateEnemy({ tokens: { ...enemy.tokens, [t.key]: (enemy.tokens[t.key] || 0) + 1 } })}
                        style={tokBtnStyle}
                      >
                        +
                      </button>
                    </div>
                  </div>
                ))}
              </div>

              <Field label="Notes">
                <textarea
                  style={{ ...textAreaStyle, marginTop: 10 }}
                  value={enemy.notes}
                  onChange={(e) => updateEnemy({ notes: e.target.value })}
                  placeholder="Tactics, dialogue cues, whatever helps at the table..."
                />
              </Field>
            </Panel>

            <Panel title="Enemy Creation Checklist" glow={utilityBlue} tag="WARRIORS · STOOGES · BOSSES" collapsible defaultOpen={false}>
              {Object.entries(ENEMY_TYPE_INFO).map(([type, info]) => (
                <div key={type} style={{ marginBottom: 14 }}>
                  <div style={{ fontFamily: headFont, fontSize: 13, color: utilityBlue, letterSpacing: 1, marginBottom: 4 }}>
                    {type.toUpperCase()}
                  </div>
                  <div style={{ fontSize: 12, color: dim, marginBottom: 6 }}>{info.summary}</div>
                  {info.checklist.map((step, idx) => (
                    <div key={idx} style={{ fontSize: 12, color: "#c3dced", marginBottom: 3, paddingLeft: 12 }}>
                      {idx + 1}. {step}
                    </div>
                  ))}
                </div>
              ))}
            </Panel>

            <Panel title="Boss Archetypes" glow={magenta} tag="BOSS / WARRIOR EXCLUSIVE — FULL INDEX" collapsible defaultOpen={false}>
              <div style={{ fontSize: 11.5, color: dim, lineHeight: 1.6, marginBottom: 10 }}>
                1E Patch'd Up: a unit built on a Boss Archetype gets one unique Super Move from it — not
                detailed here (the patch doesn't spell them out; homebrew one fitting the Ability, or use a
                Hero Archetype instead for the full Alpha/Delta pair).
              </div>
              {BOSS_ARCHETYPES.map((b) => (
                <div
                  key={b.name}
                  style={{
                    background: "#0a121d",
                    border: "1px solid #223546",
                    borderLeft: `3px solid ${magenta}`,
                    borderRadius: 3,
                    padding: "8px 12px",
                    marginBottom: 6,
                    fontSize: 12.5,
                    lineHeight: 1.55,
                  }}
                >
                  <b style={{ color: magenta }}>{b.name}</b>
                  <div style={{ color: "#c3dced" }}>{b.ability}</div>
                  <div style={{ color: dim, fontStyle: "italic", marginTop: 2 }}>{b.flavor}</div>
                  <div style={{ color: dim, fontSize: 11, marginTop: 4 }}>Requires: {b.styles.join(", ")}</div>
                </div>
              ))}
            </Panel>

            <Panel title="Enemy Advancement" glow={utilityBlue} tag="1E PATCH'D UP — ENEMIES LEVEL WITH THE PARTY" collapsible defaultOpen={false}>
              <div style={{ fontSize: 11.5, color: "#c3dced", lineHeight: 1.6, marginBottom: 10 }}>
                Enemies are always the same level as the Heroes.
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "0.6fr 1fr 1fr 2fr", gap: 4, fontSize: 11.5, marginBottom: 12 }}>
                <div style={{ color: dim, fontFamily: headFont }}>LVL</div>
                <div style={{ color: dim, fontFamily: headFont }}>BOSS DIE</div>
                <div style={{ color: dim, fontFamily: headFont }}>WARRIOR DIE</div>
                <div style={{ color: dim, fontFamily: headFont }}>BENEFIT</div>
                {ENEMY_ADVANCEMENT_TABLE.map((r) => (
                  <React.Fragment key={r.level}>
                    <div style={{ color: utilityBlue }}>{r.level}</div>
                    <div style={{ color: "#c3dced" }}>{r.bossDie}</div>
                    <div style={{ color: "#c3dced" }}>{r.warriorDie}</div>
                    <div style={{ color: "#c3dced" }}>{r.benefit}</div>
                  </React.Fragment>
                ))}
              </div>
              <div style={{ fontSize: 12, color: "#c3dced", lineHeight: 1.6 }}>
                <b style={{ color: utilityBlue }}>Stooges</b> almost never improve. At level 6 they finally gain a
                Fused or Villain Ability — that's all they ever get.
                <br />
                <br />
                <b style={{ color: utilityBlue }}>Warriors</b> add a Bonus Die exactly like Heroes, but never reach
                the mythical d12 — it caps at d10. They gain a Super Move at level 2, and at level 4 gain a
                <i> second</i> Fused or Villain Ability (a Unit can never have two Villain Archetypes).
                <br />
                <br />
                <b style={{ color: utilityBlue }}>Bosses</b> start the fight already knowing a Super Move — chosen
                from their Archetype, or a unique one if using a Boss (Villain) Archetype. Unlike Hero
                Archetypes' two Super Moves, each Boss Archetype only has one available. Bosses start with a d4
                Bonus Die and gain a <i>second</i> d4 at level 2 — from level 3 on, their lowest die steps up
                each level until both reach d12 at level 10. At level 4 they gain a second Fused/Villain Ability,
                same restriction as Warriors. At levels 5 and 10 they gain an extra Stance <i>and</i> an extra
                Super Move — that Super Move must come from an Archetype tied to one of their existing Stances'
                Styles.
                <br />
                <br />
                <b style={{ color: utilityBlue }}>Improved Archetype</b> (Warriors and Bosses, level 8): one of
                their Fused Abilities becomes its Focused version.
              </div>
            </Panel>

            <Panel title="Encounter Design" glow={utilityBlue} tag="UNITS · CINEMATIC WEIGHT" collapsible defaultOpen={false}>
              <div style={{ fontSize: 12.5, color: "#c3dced", lineHeight: 1.6, marginBottom: 10 }}>
                Match Units to Heroes 1-for-1 for a fair fight. A Warrior is 1 Unit. A Stooge group is 1 Unit
                (2 if it's a Super Stooge). A Boss is worth as many Units as it has Health Bars (2-5). Use the
                Uneven Fights complication to push past even odds on purpose.
              </div>
              <div style={{ fontSize: 11.5, color: dim, marginBottom: 4 }}>
                Cinematic Weight sets HP per Health Bar and Heal Value — see the Combat Tracker's selector for
                current (1E Patch'd Up) values:
              </div>
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 6, fontSize: 11.5 }}>
                {CINEMATIC_WEIGHTS.map((w) => (
                  <div key={w.name} style={{ background: "#0a121d", border: "1px solid #223546", borderRadius: 3, padding: "6px 8px" }}>
                    <div style={{ color: amber, fontFamily: headFont }}>{w.name}</div>
                    <div style={{ color: "#c3dced" }}>{w.hp} HP · Heal {w.heal}</div>
                  </div>
                ))}
              </div>
            </Panel>

            <Panel title="Complications" glow={danger} tag="DIRECTOR TOOLS — MIX UP A FIGHT" collapsible defaultOpen={false}>
              {COMPLICATIONS_DATA.map((c) => (
                <div
                  key={c.name}
                  style={{
                    background: "#0a121d",
                    border: "1px solid #223546",
                    borderLeft: `3px solid ${danger}`,
                    borderRadius: 3,
                    padding: "8px 12px",
                    marginBottom: 6,
                    fontSize: 12.5,
                    lineHeight: 1.55,
                  }}
                >
                  <b style={{ color: danger }}>{c.name}</b>
                  <div style={{ color: "#c3dced" }}>{c.text}</div>
                </div>
              ))}
            </Panel>

            <Panel title="Between Fights" glow={superTeal} tag="DEBUT · TROUBLE · CONTESTS · TEAMWORK" collapsible defaultOpen={false}>
              {BETWEEN_FIGHT_DATA.map((b) => (
                <div
                  key={b.name}
                  style={{
                    background: "#0a121d",
                    border: "1px solid #223546",
                    borderLeft: `3px solid ${superTeal}`,
                    borderRadius: 3,
                    padding: "8px 12px",
                    marginBottom: 6,
                    fontSize: 12.5,
                    lineHeight: 1.55,
                  }}
                >
                  <b style={{ color: superTeal }}>{b.name}</b>
                  <div style={{ color: "#c3dced" }}>{b.text}</div>
                </div>
              ))}
            </Panel>
          </>
        )}

        <div
          style={{
            textAlign: "center",
            fontFamily: monoFont,
            fontSize: 9.5,
            letterSpacing: 2,
            color: "#3a4c5c",
            marginTop: 24,
          }}
        >
          — END TRANSMISSION · SIGNAL LOST BEYOND THE DARKMATTER VOID —
        </div>
      </div>
      <Toast message={linkStatus || enemyLinkStatus} />
    </div>
  );
}

const linkBtnStyle = (color) => ({
  padding: "9px 12px",
  fontFamily: headFont,
  fontSize: 11.5,
  letterSpacing: 1,
  border: `1px solid ${color}`,
  borderRadius: 3,
  background: `${color}14`,
  color: color,
  cursor: "pointer",
  whiteSpace: "nowrap",
});

const hpBtnStyle = (color) => ({
  width: 34,
  height: 34,
  borderRadius: 3,
  border: `1px solid ${color}`,
  background: "#0a121d",
  color: color,
  fontSize: 17,
  fontWeight: 700,
  cursor: "pointer",
});

const tokBtnStyle = {
  width: 20,
  height: 20,
  borderRadius: 2,
  border: `1px solid #2c3f52`,
  background: "#111c29",
  color: textMain,
  fontSize: 12,
  fontWeight: 700,
  cursor: "pointer",
  lineHeight: 1,
};

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
