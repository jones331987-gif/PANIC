/* ---------------------------------------------------------------
   Storage adapter — uses Claude.ai's window.storage when this file
   is running as a Claude artifact, and falls back to plain
   localStorage when deployed standalone (e.g. on GitHub Pages).
--------------------------------------------------------------- */
const appStorage =
  typeof window !== "undefined" && window.storage
    ? window.storage
    : {
        async get(key) {
          const v = localStorage.getItem(key);
          if (v === null) throw new Error("not found");
          return { key, value: v };
        },
        async set(key, value) {
          localStorage.setItem(key, value);
          return { key, value };
        },
        async delete(key) {
          localStorage.removeItem(key);
          return { key, deleted: true };
        },
        async list(prefix = "") {
          const keys = Object.keys(localStorage).filter((k) => k.startsWith(prefix));
          return { keys };
        },
      };

      "Control Form only. Spend 1 to negate an enemy Action within range (they lose the number spent, nothing happens), or spend 2 to redirect it — you choose all its targets and decisions instead. Once per turn.",
  },
  {
    name: "Chaos Token",
    color: "#ff6b6b",
    category: "Archetype-specific",
    text:
      "Demon only. Spend one at any time to immediately take a 4-cost Action, interrupting whatever turn is currently happening until that Action resolves.",
  },
  {
    name: "Inspired Token",
    color: "#7dffa0",
    category: "Archetype-specific",
    text:
      "Teacher only. During an ally's turn, spend one to roll a die and add that number straight to their Action Pool.",
  },
  {
    name: "Training Token",
    color: "#ffb020",
    category: "Archetype-specific",
    text:
      "Granted by Teacher's Training Style. Before an ally performs an Action, they may spend one to increase every number listed in that Action by 1 — including its cost. Max 1 spent per turn.",
  },
];

const emptyChar = () => ({
  name: "",
  player: "",
  heroType: "Focused",
  archetype1: "Angel",
  archetype2: "Cavalry",
  archetype3: "Cyborg",
  forms: ["Blaster Form", "Iron Form", "Power Form"],
  stances: [
    { archetype: "Angel", style: "" },
    { archetype: "Angel", style: "" },
    { archetype: "Angel", style: "" },
  ],
  skills: [0, 1, 2].map(() => ""),
  hp: 12,
  maxHp: 12,
  tokens: TOKEN_TYPES.reduce((a, t) => ({ ...a, [t.key]: 0 }), {}),
  notes: "",
});

/* ---------- palette ---------- */
/* Palette pulled from the Vara Spiral polities:
   Federation teal  — idealistic, post-scarcity, the "default" register
   Imperial violet  — psionic, old, ceremonial
   Republic gold    — corporate, licensed, transactional
   Void red         — Swarm Virus corruption / critical states
   Free Space grey  — unregistered, Omega Quadrant frontier text */
const bg0 = "#05080f";
const bg1 = "#0b111c";
const bg2 = "#0f1826";
const cyan = "#3ff0ff"; // Federation
const magenta = "#c86bff"; // Imperial
const amber = "#ffb020"; // Republic
const danger = "#ff4d5e"; // Void / Swarm corruption
const dim = "#5f7688"; // Free Space grey
const textMain = "#dbeeff";

const headFont = "'Orbitron', 'Rajdhani', sans-serif";
const monoFont = "'Share Tech Mono', 'JetBrains Mono', monospace";

function Panel({ title, children, glow, right, tag }) {
  return (
    <div
      style={{
        position: "relative",
        marginBottom: 22,
        background: `linear-gradient(180deg, ${bg2}, ${bg1})`,
        border: `1px solid ${glow || cyan}33`,
        borderRadius: 4,
        padding: "16px 16px 14px",
        boxShadow: `0 0 0 1px #ffffff08 inset, 0 0 24px -14px ${glow || cyan}`,
      }}
    >
      <Corner glow={glow || cyan} pos="tl" />
      <Corner glow={glow || cyan} pos="br" />
      <div
        style={{
          display: "flex",
          alignItems: "flex-start",
          justifyContent: "space-between",
          marginBottom: 14,
        }}
      >
        <div>
          <div
            style={{
              fontFamily: headFont,
              fontSize: 13,
              letterSpacing: 3,
              textTransform: "uppercase",
              color: glow || cyan,
              display: "flex",
              alignItems: "center",
              gap: 8,
            }}
          >
            <span style={{ opacity: 0.6 }}>//</span>
            {title}
          </div>
          {tag && (
            <div
              style={{
                fontFamily: monoFont,
                fontSize: 9.5,
                letterSpacing: 1.5,
                color: dim,
                marginTop: 2,
                marginLeft: 16,
              }}
            >
              {tag}
            </div>
          )}
        </div>
        {right}
      </div>
      {children}
    </div>
  );
}

function Corner({ glow, pos }) {
  const styles = {
    tl: { top: -1, left: -1, borderTop: `2px solid ${glow}`, borderLeft: `2px solid ${glow}` },
    br: { bottom: -1, right: -1, borderBottom: `2px solid ${glow}`, borderRight: `2px solid ${glow}` },
  };
  return (
    <div
      style={{
        position: "absolute",
        width: 14,
        height: 14,
        ...styles[pos],
      }}
    />
  );
}

function Field({ label, children }) {
  return (
    <div style={{ marginBottom: 12 }}>
      <div
        style={{
          fontFamily: monoFont,
          fontSize: 10.5,
          fontWeight: 700,
          letterSpacing: 1.5,
          textTransform: "uppercase",
          color: dim,
          marginBottom: 5,
        }}
      >
        {label}
      </div>
      {children}
    </div>
  );
}

const selectStyle = {
  width: "100%",
  padding: "9px 10px",
  fontSize: 13.5,
  fontFamily: monoFont,
  border: `1px solid #2c3f52`,
  borderRadius: 3,
  background: "#0a121d",
  color: textMain,
  outline: "none",
};

const inputStyle = { ...selectStyle };

const textAreaStyle = {
  ...selectStyle,
  minHeight: 80,
  resize: "vertical",
  lineHeight: 1.5,
};

function TypeToggle({ options, value, onChange }) {
  return (
    <div style={{ display: "flex", gap: 6 }}>
      {options.map((t) => (
        <button
          key={t}
          onClick={() => onChange(t)}
          className="tab-btn"
          style={{
            flex: 1,
            padding: "8px 4px",
            fontFamily: headFont,
            fontSize: 12,
            letterSpacing: 1,
            border: `1px solid ${value === t ? cyan : "#2c3f52"}`,
            borderRadius: 3,
            background: value === t ? `${cyan}1a` : "transparent",
            color: value === t ? cyan : dim,
            cursor: "pointer",
            textTransform: "uppercase",
          }}
        >
          {t}
        </button>
      ))}
    </div>
  );
}

/* ---------- collapsible stance readout used in Combat tab ---------- */
function StanceCard({ i, form, style, archetype, archetypeAbilityText, heroType, expanded, onToggle }) {
  const stanceLabel = style
    ? `${style.name.replace(" Style", "")} ${form.name.replace(" Form", "")}`
    : form.name;

  return (
    <div
      style={{
        border: `1px solid ${expanded ? cyan : "#243748"}`,
        borderRadius: 4,
        marginBottom: 10,
        background: "#0a121d",
        overflow: "hidden",
        transition: "border-color .15s",
      }}
    >
      <button
        onClick={onToggle}
        style={{
          width: "100%",
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
          padding: "10px 12px",
          background: expanded ? `${cyan}14` : "transparent",
          border: "none",
          cursor: "pointer",
          textAlign: "left",
        }}
      >
        <div>
          <div style={{ fontFamily: headFont, fontSize: 13, letterSpacing: 1, color: cyan }}>
            STANCE {i + 1} — {stanceLabel.toUpperCase()}
          </div>
          <div style={{ fontFamily: monoFont, fontSize: 11, color: dim, marginTop: 2 }}>
            {style ? `RANGE ${style.range}` : "no style selected"} · {archetype}
          </div>
        </div>
        <div
          style={{
            color: cyan,
            fontFamily: monoFont,
            fontSize: 16,
            transform: expanded ? "rotate(180deg)" : "none",
            transition: "transform .15s",
          }}
        >
          ▾
        </div>
      </button>

      {expanded && (
        <div style={{ padding: "0 12px 14px", fontFamily: monoFont, fontSize: 12.5, lineHeight: 1.6, color: "#c3dced" }}>
          <div style={{ borderTop: "1px solid #1c2c3b", paddingTop: 10, marginTop: 2 }}>
            <div style={{ color: amber, fontWeight: 700, marginBottom: 3 }}>
              FORM · {form.name.toUpperCase()}{" "}
              <span style={{ color: dim, fontWeight: 400 }}>({form.alts})</span>
            </div>
            <div style={{ marginBottom: 6 }}>{form.ability}</div>
            {form.actions.map((a) => (
              <div key={a.name} style={{ marginBottom: 3 }}>
                <span style={{ color: cyan }}>
                  {a.cost}: {a.name}
                </span>{" "}
                — {a.effect}
              </div>
            ))}
            <div style={{ marginTop: 4, color: dim, fontStyle: "italic" }}>SKILL · {form.skill}</div>
          </div>

          {style && (
            <div style={{ borderTop: "1px solid #1c2c3b", paddingTop: 10, marginTop: 10 }}>
              <div style={{ color: magenta, fontWeight: 700, marginBottom: 3 }}>
                STYLE · {style.name.toUpperCase()} <span style={{ color: dim, fontWeight: 400 }}>(range {style.range})</span>
              </div>
              <div>{style.ability}</div>
            </div>
          )}

          {archetypeAbilityText && (
            <div style={{ borderTop: "1px solid #1c2c3b", paddingTop: 10, marginTop: 10 }}>
              <div style={{ color: "#7dffa0", fontWeight: 700, marginBottom: 3 }}>
                {heroType.toUpperCase()} {archetype.toUpperCase()} ABILITY <span style={{ color: dim, fontWeight: 400 }}>(always active)</span>
              </div>
              <div>{archetypeAbilityText}</div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function App() {
  const [char, setChar] = useState(emptyChar());
  const [tab, setTab] = useState("build");
  const [expanded, setExpanded] = useState({ 0: true, 1: false, 2: false });
  const [savedRoster, setSavedRoster] = useState([]);
  const [selectedSave, setSelectedSave] = useState("");
  const [linkStatus, setLinkStatus] = useState("");
  const [linkBusy, setLinkBusy] = useState(false);

  function slugify(str) {
    return (
      (str || "").trim().toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "") ||
      "unnamed-hero"
    );
  }

  async function refreshRoster() {
    try {
      const res = await appStorage.list("hero:");
      setSavedRoster((res && res.keys) || []);
    } catch (e) {
      setSavedRoster([]);
    }
  }

  React.useEffect(() => {
    refreshRoster();
  }, []);

  async function saveHero() {
    setLinkBusy(true);
    setLinkStatus("");
    try {
      const key = `hero:${slugify(char.name)}`;
      const result = await appStorage.set(key, JSON.stringify(char));
      if (result) {
        setLinkStatus(`SAVED — "${char.name || "Unnamed Hero"}"`);
        await refreshRoster();
        setSelectedSave(key);
      } else {
        setLinkStatus("SAVE FAILED — LINK ERROR");
      }
    } catch (e) {
      setLinkStatus("SAVE FAILED — LINK ERROR");
    }
    setLinkBusy(false);
  }

  async function loadHero(key) {
    if (!key) return;
    setLinkBusy(true);
    setLinkStatus("");
    try {
      const result = await appStorage.get(key);
      if (result && result.value) {
        const loaded = JSON.parse(result.value);
        setChar({ ...emptyChar(), ...loaded });
        setLinkStatus(`LOADED — "${loaded.name || "Unnamed Hero"}"`);
      } else {
        setLinkStatus("NOT FOUND ON RECORD");
      }
    } catch (e) {
      setLinkStatus("LOAD FAILED — LINK ERROR");
    }
    setLinkBusy(false);
  }

  async function deleteHero(key) {
    if (!key) return;
    setLinkBusy(true);
    try {
      await appStorage.delete(key);
      setLinkStatus("RECORD PURGED");
      setSelectedSave("");
      await refreshRoster();
    } catch (e) {
      setLinkStatus("DELETE FAILED — LINK ERROR");
    }
    setLinkBusy(false);
  }

  function newHero() {
    setChar(emptyChar());
    setSelectedSave("");
    setLinkStatus("NEW RECORD STARTED");
  }

  const archetypesAvailable = useMemo(() => {
    if (char.heroType === "Focused") return [char.archetype1];
    if (char.heroType === "Fused") return [char.archetype1, char.archetype2];
    return [char.archetype1, char.archetype2, char.archetype3];
  }, [char.heroType, char.archetype1, char.archetype2, char.archetype3]);

  function update(patch) {
    setChar((c) => ({ ...c, ...patch }));
  }

  function updateStance(i, patch) {
    setChar((c) => {
      const stances = c.stances.map((s, idx) => (idx === i ? { ...s, ...patch } : s));
      return { ...c, stances };
    });
  }

  function updateForm(i, formName) {
    setChar((c) => {
      const forms = c.forms.map((f, idx) => (idx === i ? formName : f));
      return { ...c, forms };
    });
  }

  function updateSkill(i, val) {
    setChar((c) => {
      const skills = c.skills.map((s, idx) => (idx === i ? val : s));
      return { ...c, skills };
    });
  }

  function bumpToken(type, delta) {
    setChar((c) => ({
      ...c,
      tokens: { ...c.tokens, [type]: Math.max(0, (c.tokens[type] || 0) + delta) },
    }));
  }

  function bumpHp(delta) {
    setChar((c) => ({ ...c, hp: Math.max(0, Math.min(c.maxHp, c.hp + delta)) }));
  }

  function labelFromKey(key) {
    return key
      .replace(/^hero:/, "")
      .split("-")
      .map((w) => (w ? w[0].toUpperCase() + w.slice(1) : w))
      .join(" ");
  }

  function buildExportText() {
    const lines = [];
    lines.push("=".repeat(48));
    lines.push(`PANIC AT THE DOJO — HERO RECORD`);
    lines.push(`VARA SPIRAL NETWORK · OMEGA QUADRANT RELAY`);
    lines.push("=".repeat(48));
    lines.push("");
    lines.push(`NAME:      ${char.name || "Unnamed Hero"}`);
    lines.push(`PLAYER:    ${char.player || "—"}`);
    lines.push(`HERO TYPE: ${char.heroType}`);
    lines.push(`ARCHETYPES: ${archetypesAvailable.join(", ")}`);
    lines.push(`HP:        ${char.hp} / ${char.maxHp}`);
    lines.push("");
    archetypesAvailable.forEach((a) => {
      lines.push(`[${char.heroType.toUpperCase()} ${a.toUpperCase()}]`);
      lines.push(GAME_DATA.archetypes[a][char.heroType.toLowerCase()]);
      lines.push("");
    });
    lines.push("-".repeat(48));
    lines.push("STANCES");
    lines.push("-".repeat(48));
    char.stances.forEach((s, i) => {
      const form = formObjs[i];
      if (!form) return;
      const stanceArchetype = char.heroType === "Focused" ? char.archetype1 : s.archetype;
      const styleObj = (GAME_DATA.styles[stanceArchetype] || []).find((x) => x.name === s.style);
      const label = styleObj ? `${styleObj.name.replace(" Style", "")} ${form.name.replace(" Form", "")}` : form.name;
      lines.push("");
      lines.push(`STANCE ${i + 1}: ${label}`);
      lines.push(`  Form: ${form.name} (${form.alts})`);
      lines.push(`    ${form.ability}`);
      form.actions.forEach((a) => lines.push(`    ${a.cost}: ${a.name} — ${a.effect}`));
      lines.push(`    Skill: ${form.skill}`);
      if (styleObj) {
        lines.push(`  Style: ${styleObj.name} (Range ${styleObj.range})`);
        lines.push(`    ${styleObj.ability}`);
      } else {
        lines.push(`  Style: — not selected —`);
      }
    });
    lines.push("");
    lines.push("-".repeat(48));
    lines.push("SKILLS");
    lines.push("-".repeat(48));
    char.skills.forEach((sk, i) => {
      lines.push(`  ${i + 1}. ${sk || formObjs[i]?.skill || "—"}`);
    });
    lines.push("");
    lines.push("-".repeat(48));
    lines.push("TOKENS ON HAND");
    lines.push("-".repeat(48));
    TOKEN_TYPES.forEach((t) => lines.push(`  ${t.key}: ${char.tokens[t.key] || 0}`));
    if (char.notes) {
      lines.push("");
      lines.push("-".repeat(48));
      lines.push("FIELD NOTES");
      lines.push("-".repeat(48));
      lines.push(char.notes);
    }
    lines.push("");
    lines.push("=".repeat(48));
    lines.push("END TRANSMISSION");
    lines.push("=".repeat(48));
    return lines.join("\n");
  }

  function downloadExport() {
    const text = buildExportText();
    const blob = new Blob([text], { type: "text/plain" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `${slugify(char.name)}-hero-sheet.txt`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  const formObjs = char.forms.map((fn) => GAME_DATA.forms.find((f) => f.name === fn));
  const hpPct = char.maxHp > 0 ? char.hp / char.maxHp : 0;
  const hpColor = hpPct <= 0.25 ? danger : hpPct <= 0.5 ? amber : cyan;

  return (
    <div
      style={{
        minHeight: "100vh",
        background: `
          radial-gradient(ellipse at 20% -10%, #10233a 0%, transparent 55%),
          radial-gradient(ellipse at 100% 0%, #2a0f3a 0%, transparent 45%),
          ${bg0}`,
        fontFamily: monoFont,
        color: textMain,
        padding: "0 0 60px",
      }}
    >
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@600;700&display=swap');
        * { box-sizing: border-box; }
        ::selection { background: ${cyan}; color: #001018; }
        .tab-btn { transition: all .15s; cursor: pointer; }
        .tab-btn:hover { filter: brightness(1.3); }
        input:focus, select:focus, textarea:focus { border-color: ${cyan} !important; box-shadow: 0 0 0 1px ${cyan}55; }
        .tok-btn { transition: transform .1s; cursor: pointer; }
        .tok-btn:active { transform: scale(0.88); }
        body { background: ${bg0}; }
        @keyframes scan {
          0% { background-position: 0 0; }
          100% { background-position: 0 40px; }
        }
        @media print {
          body * { visibility: hidden; }
          #export-sheet, #export-sheet * { visibility: visible; }
          #export-sheet { position: absolute; top: 0; left: 0; width: 100%; }
        }
      `}</style>

      {/* Header */}
      <div
        style={{
          position: "relative",
          background: `linear-gradient(180deg, #0c1524, #060a12)`,
          borderBottom: `1px solid ${cyan}44`,
          padding: "26px 20px 20px",
          textAlign: "center",
          overflow: "hidden",
        }}
      >
        <div
          style={{
            position: "absolute",
            inset: 0,
            backgroundImage: `repeating-linear-gradient(180deg, ${cyan}08 0px, transparent 2px, transparent 4px)`,
            animation: "scan 6s linear infinite",
            pointerEvents: "none",
          }}
        />
        <div
          style={{
            fontFamily: headFont,
            fontWeight: 900,
            fontSize: 34,
            letterSpacing: 5,
            color: textMain,
            lineHeight: 1.1,
            textShadow: `0 0 18px ${cyan}88`,
          }}
        >
          PANIC <span style={{ color: cyan }}>//</span> DOJO
        </div>
        <div
          style={{
            fontFamily: monoFont,
            fontSize: 11,
            letterSpacing: 3,
            color: dim,
            marginTop: 6,
            textTransform: "uppercase",
          }}
        >
          [ hero build interface · combat readout · stance archive ]
        </div>
        <div
          style={{
            fontFamily: monoFont,
            fontSize: 9.5,
            letterSpacing: 2,
            color: "#3a4c5c",
            marginTop: 10,
          }}
        >
          RELAYED FROM THE OMEGA QUADRANT · FREE SPACE UPLINK · VARA SPIRAL NETWORK
        </div>
      </div>

      {/* Tabs */}
      <div
        style={{
          display: "flex",
          flexWrap: "wrap",
          justifyContent: "center",
          gap: 8,
          margin: "18px auto 0",
          maxWidth: 640,
          padding: "0 16px",
        }}
      >
        {[
          ["build", "Build Hero"],
          ["combat", "Combat Tracker"],
          ["reference", "Stance Reference"],
          ["export", "Export Sheet"],
        ].map(([key, label]) => (
          <button
            key={key}
            className="tab-btn"
            onClick={() => setTab(key)}
            style={{
              flex: "1 1 auto",
              minWidth: 120,
              padding: "10px 8px",
              fontFamily: headFont,
              fontSize: 13,
              letterSpacing: 1,
              border: `1px solid ${tab === key ? cyan : "#233448"}`,
              borderRadius: 3,
              background: tab === key ? `${cyan}1f` : "#0a121d",
              color: tab === key ? cyan : dim,
              textTransform: "uppercase",
              boxShadow: tab === key ? `0 0 14px -4px ${cyan}` : "none",
            }}
          >
            {label}
          </button>
        ))}
      </div>

      <div style={{ maxWidth: 640, margin: "22px auto 0", padding: "0 16px" }}>
        {tab === "build" && (
          <>
            <Panel title="Data Link" tag="PERSONAL STORAGE — LOCAL TO THIS DEVICE" glow="#7dffa0">
              <div style={{ display: "grid", gridTemplateColumns: "1fr auto", gap: 8, marginBottom: 10 }}>
                <button
                  disabled={linkBusy}
                  onClick={saveHero}
                  style={{
                    ...linkBtnStyle("#7dffa0"),
                    opacity: linkBusy ? 0.5 : 1,
                  }}
                >
                  ⬇ SAVE HERO
                </button>
                <button disabled={linkBusy} onClick={newHero} style={linkBtnStyle(dim)}>
                  + NEW
                </button>
              </div>
              <Field label="Load / delete a saved record">
                <div style={{ display: "grid", gridTemplateColumns: "1fr auto auto", gap: 6 }}>
                  <select
                    style={selectStyle}
                    value={selectedSave}
                    onChange={(e) => setSelectedSave(e.target.value)}
                  >
                    <option value="">— select saved hero —</option>
                    {savedRoster.map((key) => (
                      <option key={key} value={key}>
                        {labelFromKey(key)}
                      </option>
                    ))}
                  </select>
                  <button
                    disabled={linkBusy || !selectedSave}
                    onClick={() => loadHero(selectedSave)}
                    style={linkBtnStyle(cyan)}
                  >
                    LOAD
                  </button>
                  <button
                    disabled={linkBusy || !selectedSave}
                    onClick={() => deleteHero(selectedSave)}
                    style={linkBtnStyle(danger)}
                  >
                    DEL
                  </button>
                </div>
              </Field>
              {linkStatus && (
                <div style={{ fontFamily: monoFont, fontSize: 11, color: dim, letterSpacing: 1 }}>
                  &gt; {linkStatus}
                </div>
              )}
            </Panel>

            <Panel title="Hero Identity" tag="FEDERATION CIVIL REGISTRY — LAMBDA QUADRANT">
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12 }}>
                <Field label="Hero Name">
                  <input
                    style={inputStyle}
                    value={char.name}
                    onChange={(e) => update({ name: e.target.value })}
                    placeholder="e.g. Crimson Fang"
                  />
                </Field>
                <Field label="Player">
                  <input
                    style={inputStyle}
                    value={char.player}
                    onChange={(e) => update({ player: e.target.value })}
                    placeholder="Your name"
                  />
                </Field>
              </div>
              <Field label="Hero Type">
                <TypeToggle options={HERO_TYPES} value={char.heroType} onChange={(t) => update({ heroType: t })} />
                <div style={{ fontSize: 11.5, color: dim, marginTop: 8, lineHeight: 1.5 }}>
                  {char.heroType === "Focused" &&
                    "One Archetype, all 3 Styles from it. Strong, reliable Ability."}
                  {char.heroType === "Fused" &&
                    "Two Archetypes — 2 Styles from one, 1 from the other. Two half-strength Abilities."}
                  {char.heroType === "Frantic" &&
                    "Three Archetypes, ultimate flexibility — but you can't repeat last turn's Form, Style, or Ability."}
                </div>
              </Field>
            </Panel>

            <Panel title="Archetypes" glow={magenta} tag="IMPERIAL PSIONIC DISCIPLINE INDEX — EPSILON QUADRANT">
              <div
                style={{
                  display: "grid",
                  gridTemplateColumns:
                    char.heroType === "Focused" ? "1fr" : char.heroType === "Fused" ? "1fr 1fr" : "1fr 1fr 1fr",
                  gap: 10,
                }}
              >
                {["archetype1", "archetype2", "archetype3"]
                  .slice(0, char.heroType === "Focused" ? 1 : char.heroType === "Fused" ? 2 : 3)
                  .map((key, i) => (
                    <Field key={key} label={`Archetype ${i + 1}`}>
                      <select style={selectStyle} value={char[key]} onChange={(e) => update({ [key]: e.target.value })}>
                        {ARCHETYPE_NAMES.map((n) => (
                          <option key={n} value={n}>
                            {n}
                          </option>
                        ))}
                      </select>
                    </Field>
                  ))}
              </div>
              {archetypesAvailable.map((a) => (
                <div
                  key={a}
                  style={{
                    background: "#0a121d",
                    border: `1px solid #2c3f52`,
                    borderRadius: 4,
                    padding: "10px 12px",
                    marginTop: 8,
                    fontSize: 12.5,
                    lineHeight: 1.6,
                  }}
                >
                  <div style={{ fontFamily: headFont, fontWeight: 700, color: magenta, marginBottom: 3, letterSpacing: 0.5 }}>
                    {char.heroType.toUpperCase()} {a.toUpperCase()}
                  </div>
                  <div style={{ color: "#c3dced" }}>{GAME_DATA.archetypes[a][char.heroType.toLowerCase()]}</div>
                </div>
              ))}
            </Panel>

            <Panel
              title="Forms & Stances"
              glow={amber}
              tag="REPUBLIC COMBAT LICENSING BUREAU — RHO QUADRANT"
              right={<span style={{ fontFamily: monoFont, fontSize: 10, color: dim }}>SELECT 3</span>}
            >
              {[0, 1, 2].map((i) => {
                const form = formObjs[i];
                const stance = char.stances[i];
                const stanceArchetype = char.heroType === "Focused" ? char.archetype1 : stance.archetype;
                const stylesForArchetype = GAME_DATA.styles[stanceArchetype] || [];
                return (
                  <div
                    key={i}
                    style={{
                      border: `1px solid #223546`,
                      borderRadius: 4,
                      padding: 12,
                      marginBottom: 12,
                      background: "#0a121d",
                    }}
                  >
                    <div style={{ fontFamily: headFont, fontSize: 13, letterSpacing: 1.5, marginBottom: 10, color: amber }}>
                      STANCE {i + 1}
                    </div>
                    <div
                      style={{
                        display: "grid",
                        gridTemplateColumns: char.heroType === "Focused" ? "1fr 1fr" : "1fr 1fr 1fr",
                        gap: 8,
                        marginBottom: 8,
                      }}
                    >
                      <Field label="Form">
                        <select style={selectStyle} value={char.forms[i]} onChange={(e) => updateForm(i, e.target.value)}>
                          {GAME_DATA.forms.map((f) => (
                            <option key={f.name} value={f.name}>
                              {f.name}
                            </option>
                          ))}
                        </select>
                      </Field>
                      {char.heroType !== "Focused" && (
                        <Field label="From Archetype">
                          <select
                            style={selectStyle}
                            value={stance.archetype}
                            onChange={(e) => updateStance(i, { archetype: e.target.value, style: "" })}
                          >
                            {archetypesAvailable.map((a) => (
                              <option key={a} value={a}>
                                {a}
                              </option>
                            ))}
                          </select>
                        </Field>
                      )}
                      <Field label="Style">
                        <select style={selectStyle} value={stance.style} onChange={(e) => updateStance(i, { style: e.target.value })}>
                          <option value="">— choose —</option>
                          {stylesForArchetype.map((s) => (
                            <option key={s.name} value={s.name}>
                              {s.name}
                            </option>
                          ))}
                        </select>
                      </Field>
                    </div>

                    {form && (
                      <div style={{ fontSize: 12, lineHeight: 1.55, marginBottom: 6 }}>
                        <b style={{ color: cyan }}>{form.name}</b>{" "}
                        <span style={{ color: dim }}>({form.alts})</span>
                        <div style={{ margin: "3px 0" }}>{form.ability}</div>
                        {form.actions.map((a) => (
                          <div key={a.name} style={{ margin: "2px 0" }}>
                            <b>{a.cost}: {a.name}</b> — {a.effect}
                          </div>
                        ))}
                      </div>
                    )}
                    {stance.style && (
                      <div style={{ fontSize: 12, lineHeight: 1.55, borderTop: "1px dashed #223546", paddingTop: 6 }}>
                        {(() => {
                          const s = stylesForArchetype.find((x) => x.name === stance.style);
                          if (!s) return null;
                          return (
                            <>
                              <b style={{ color: magenta }}>
                                {s.name} <span style={{ fontWeight: 400 }}>(Range: {s.range})</span>
                              </b>
                              <div style={{ margin: "3px 0" }}>{s.ability}</div>
                            </>
                          );
                        })()}
                      </div>
                    )}
                    {stance.style && form && (
                      <div
                        style={{
                          marginTop: 8,
                          fontFamily: headFont,
                          fontSize: 12,
                          letterSpacing: 1,
                          textAlign: "center",
                          color: bg0,
                          background: cyan,
                          borderRadius: 3,
                          padding: "6px",
                        }}
                      >
                        {stance.style.replace(" Style", "").toUpperCase()} {form.name.replace(" Form", "").toUpperCase()}
                      </div>
                    )}
                  </div>
                );
              })}
            </Panel>

            <Panel title="Skills" glow="#7dffa0" tag="UNREGISTERED — OMEGA QUADRANT FREE SPACE">
              {[0, 1, 2].map((i) => (
                <Field key={i} label={`Skill ${i + 1} (default: ${formObjs[i]?.skill.split(" — ")[0] || "—"})`}>
                  <input
                    style={inputStyle}
                    value={char.skills[i]}
                    placeholder={formObjs[i]?.skill || ""}
                    onChange={(e) => updateSkill(i, e.target.value)}
                  />
                </Field>
              ))}
              <div style={{ fontSize: 11, color: dim, lineHeight: 1.5 }}>
                Leave a box blank to keep the Form's default Skill (shown as placeholder text). Type a
                replacement to trade it — you may trade one Skill for any Skill of your choice during Hero
                creation.
              </div>
            </Panel>
          </>
        )}

        {tab === "combat" && (
          <>
            <Panel title="Hero Readout" tag="LIVE FIELD UPLINK — VARA SPIRAL RELAY">
              <div style={{ fontFamily: headFont, fontSize: 22, letterSpacing: 1.5, color: textMain, marginBottom: 4 }}>
                {char.name || "UNNAMED HERO"}
              </div>
              <div style={{ fontFamily: monoFont, fontSize: 12, color: dim }}>
                {char.heroType.toUpperCase()} · {archetypesAvailable.join(" / ").toUpperCase()}
                {char.player ? ` · PLAYER: ${char.player}` : ""}
              </div>
            </Panel>

            <Panel
              title="Health"
              glow={hpColor}
              tag={hpPct <= 0.25 ? "WARNING — VOID SIGNAL BLEEDING THROUGH" : "VITALS NOMINAL"}
            >
              <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 4 }}>
                <button className="tok-btn" onClick={() => bumpHp(-1)} style={hpBtnStyle(hpColor)}>
                  −
                </button>
                <div style={{ flex: 1 }}>
                  <div
                    style={{
                      display: "flex",
                      gap: 3,
                      height: 22,
                    }}
                  >
                    {Array.from({ length: char.maxHp }).map((_, idx) => (
                      <div
                        key={idx}
                        style={{
                          flex: 1,
                          background: idx < char.hp ? hpColor : "#111c29",
                          border: `1px solid ${idx < char.hp ? hpColor : "#22364a"}`,
                          boxShadow: idx < char.hp ? `0 0 6px -1px ${hpColor}` : "none",
                        }}
                      />
                    ))}
                  </div>
                  <div style={{ textAlign: "center", fontFamily: headFont, fontWeight: 700, marginTop: 6, color: hpColor, letterSpacing: 1 }}>
                    {char.hp} / {char.maxHp} HP
                  </div>
                </div>
                <button className="tok-btn" onClick={() => bumpHp(1)} style={hpBtnStyle(hpColor)}>
                  +
                </button>
              </div>
              <Field label="Max HP (set by fight's Cinematic Weight)">
                <input
                  type="number"
                  style={{ ...inputStyle, width: 110 }}
                  value={char.maxHp}
                  onChange={(e) => {
                    const v = Math.max(1, parseInt(e.target.value) || 1);
                    update({ maxHp: v, hp: Math.min(char.hp, v) });
                  }}
                />
              </Field>
            </Panel>

            <Panel title="Tokens" glow={magenta} tag="OMEGA QUADRANT TRADE STANDARD">
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                {TOKEN_TYPES.map((t) => (
                  <div
                    key={t.key}
                    style={{
                      display: "flex",
                      alignItems: "center",
                      justifyContent: "space-between",
                      background: "#0a121d",
                      border: `1px solid #223546`,
                      borderLeft: `3px solid ${t.color}`,
                      borderRadius: 3,
                      padding: "8px 10px",
                    }}
                  >
                    <span style={{ fontFamily: headFont, fontSize: 12, letterSpacing: 1, color: t.color }}>
                      {t.key.toUpperCase()}
                    </span>
                    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                      <button className="tok-btn" onClick={() => bumpToken(t.key, -1)} style={tokBtnStyle}>
                        −
                      </button>
                      <span style={{ minWidth: 18, textAlign: "center", fontFamily: monoFont, fontWeight: 700 }}>
                        {char.tokens[t.key] || 0}
                      </span>
                      <button className="tok-btn" onClick={() => bumpToken(t.key, 1)} style={tokBtnStyle}>
                        +
                      </button>
                    </div>
                  </div>
                ))}
              </div>
            </Panel>

            <Panel
              title="Active Stances"
              glow={amber}
              tag="REPUBLIC LICENSED LOADOUT"
              right={
                <span style={{ fontFamily: monoFont, fontSize: 10, color: dim }}>tap to expand</span>
              }
            >
              {char.stances.map((s, i) => {
                const form = formObjs[i];
                if (!form) return null;
                const stanceArchetype = char.heroType === "Focused" ? char.archetype1 : s.archetype;
                const styleObj = (GAME_DATA.styles[stanceArchetype] || []).find((x) => x.name === s.style) || null;
                return (
                  <StanceCard
                    key={i}
                    i={i}
                    form={form}
                    style={styleObj}
                    archetype={stanceArchetype}
                    archetypeAbilityText={GAME_DATA.archetypes[stanceArchetype]?.[char.heroType.toLowerCase()]}
                    heroType={char.heroType}
                    expanded={!!expanded[i]}
                    onToggle={() => setExpanded((e) => ({ ...e, [i]: !e[i] }))}
                  />
                );
              })}
            </Panel>

            <Panel title="Field Notes" glow="#7dffa0" tag="OFF-RECORD — LOCAL STORAGE ONLY">
              <textarea
                style={textAreaStyle}
                value={char.notes}
                onChange={(e) => update({ notes: e.target.value })}
                placeholder="Track Challenge tokens held/given, Shields, obstacles, whatever helps at the table..."
              />
            </Panel>
          </>
        )}

        {tab === "reference" && (
          <>
            <Panel title="Token Glossary" glow={magenta} tag="OMEGA QUADRANT TRADE STANDARD — FULL INDEX">
              {["Basic", "Common", "Archetype-specific"].map((cat) => (
                <div key={cat} style={{ marginBottom: 14 }}>
                  <div
                    style={{
                      fontFamily: headFont,
                      fontSize: 11,
                      letterSpacing: 2,
                      color: dim,
                      textTransform: "uppercase",
                      marginBottom: 6,
                    }}
                  >
                    {cat} tokens
                  </div>
                  {TOKEN_GLOSSARY.filter((t) => t.category === cat).map((t) => (
                    <div
                      key={t.name}
                      style={{
                        background: "#0a121d",
                        border: `1px solid #223546`,
                        borderLeft: `3px solid ${t.color}`,
                        borderRadius: 3,
                        padding: "8px 12px",
                        marginBottom: 6,
                        fontSize: 12.5,
                        lineHeight: 1.55,
                      }}
                    >
                      <b style={{ color: t.color }}>{t.name}</b>
                      <div style={{ color: "#c3dced" }}>{t.text}</div>
                    </div>
                  ))}
                </div>
              ))}
            </Panel>

            <Panel title="All Forms &amp; Skills" glow={cyan} tag="FEDERATION OPEN ARCHIVE — PUBLIC ACCESS">
              {GAME_DATA.forms.map((f) => (
                <div
                  key={f.name}
                  style={{
                    background: "#0a121d",
                    border: `1px solid #223546`,
                    borderRadius: 4,
                    padding: "10px 12px",
                    marginBottom: 8,
                    fontSize: 12.5,
                    lineHeight: 1.55,
                  }}
                >
                  <b style={{ color: cyan }}>{f.name}</b> <span style={{ color: dim }}>({f.alts})</span>
                  <div>{f.ability}</div>
                  {f.actions.map((a) => (
                    <div key={a.name}>
                      <b>{a.cost}: {a.name}</b> — {a.effect}
                    </div>
                  ))}
                  <div style={{ marginTop: 3, fontStyle: "italic", color: "#7dffa0" }}>Skill: {f.skill}</div>
                </div>
              ))}
            </Panel>
          </>
        )}

        {tab === "export" && (
          <>
            <Panel title="Export Controls" glow="#7dffa0" tag="TRANSMIT RECORD OFF-DEVICE">
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 8 }}>
                <button onClick={downloadExport} style={linkBtnStyle("#7dffa0")}>
                  ⬇ DOWNLOAD .TXT
                </button>
                <button onClick={() => window.print()} style={linkBtnStyle(cyan)}>
                  🖨 PRINT / SAVE PDF
                </button>
              </div>
            </Panel>

            <div id="export-sheet">
              <Panel title="Hero Sheet" glow={amber} tag="FULL RECORD — ALL STANCES &amp; TOKENS">
                <div style={{ fontFamily: headFont, fontSize: 22, letterSpacing: 1.5, color: textMain, marginBottom: 2 }}>
                  {char.name || "UNNAMED HERO"}
                </div>
                <div style={{ fontFamily: monoFont, fontSize: 12, color: dim, marginBottom: 12 }}>
                  {char.player ? `PLAYER: ${char.player} · ` : ""}
                  {char.heroType.toUpperCase()} · {archetypesAvailable.join(" / ").toUpperCase()} · {char.hp}/{char.maxHp} HP
                </div>

                {archetypesAvailable.map((a) => (
                  <div
                    key={a}
                    style={{
                      background: "#0a121d",
                      border: `1px solid #2c3f52`,
                      borderLeft: `3px solid ${magenta}`,
                      borderRadius: 3,
                      padding: "8px 12px",
                      marginBottom: 8,
                      fontSize: 12.5,
                      lineHeight: 1.55,
                    }}
                  >
                    <b style={{ color: magenta }}>
                      {char.heroType.toUpperCase()} {a.toUpperCase()}
                    </b>
                    <div style={{ color: "#c3dced" }}>{GAME_DATA.archetypes[a][char.heroType.toLowerCase()]}</div>
                  </div>
                ))}

                <div style={{ fontFamily: headFont, fontSize: 12, letterSpacing: 2, color: amber, margin: "14px 0 8px" }}>
                  STANCES
                </div>
                {char.stances.map((s, i) => {
                  const form = formObjs[i];
                  if (!form) return null;
                  const stanceArchetype = char.heroType === "Focused" ? char.archetype1 : s.archetype;
                  const styleObj = (GAME_DATA.styles[stanceArchetype] || []).find((x) => x.name === s.style);
                  const label = styleObj
                    ? `${styleObj.name.replace(" Style", "")} ${form.name.replace(" Form", "")}`
                    : form.name;
                  return (
                    <div
                      key={i}
                      style={{
                        background: "#0a121d",
                        border: `1px solid #223546`,
                        borderRadius: 4,
                        padding: "10px 12px",
                        marginBottom: 8,
                        fontSize: 12.5,
                        lineHeight: 1.55,
                      }}
                    >
                      <b style={{ color: amber }}>
                        STANCE {i + 1} — {label.toUpperCase()}
                      </b>
                      <div style={{ marginTop: 4 }}>
                        <span style={{ color: cyan }}>{form.name}</span> ({form.alts})
                        <div>{form.ability}</div>
                        {form.actions.map((a) => (
                          <div key={a.name}>
                            <b>{a.cost}: {a.name}</b> — {a.effect}
                          </div>
                        ))}
                        <div style={{ fontStyle: "italic", color: "#7dffa0" }}>Skill: {form.skill}</div>
                      </div>
                      {styleObj && (
                        <div style={{ marginTop: 6, borderTop: "1px dashed #223546", paddingTop: 6 }}>
                          <span style={{ color: magenta }}>
                            {styleObj.name} (Range {styleObj.range})
                          </span>
                          <div>{styleObj.ability}</div>
                        </div>
                      )}
                    </div>
                  );
                })}

                <div style={{ fontFamily: headFont, fontSize: 12, letterSpacing: 2, color: amber, margin: "14px 0 8px" }}>
                  SKILLS
                </div>
                <div style={{ fontSize: 12.5, lineHeight: 1.7, marginBottom: 14 }}>
                  {char.skills.map((sk, i) => (
                    <div key={i}>{i + 1}. {sk || formObjs[i]?.skill || "—"}</div>
                  ))}
                </div>

                <div style={{ fontFamily: headFont, fontSize: 12, letterSpacing: 2, color: amber, margin: "14px 0 8px" }}>
                  TOKENS ON HAND
                </div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 6, marginBottom: 14 }}>
                  {TOKEN_TYPES.map((t) => (
                    <div key={t.key} style={{ fontSize: 12.5, borderLeft: `3px solid ${t.color}`, paddingLeft: 8 }}>
                      {t.key}: <b>{char.tokens[t.key] || 0}</b>
                    </div>
                  ))}
                </div>

                {char.notes && (
                  <>
                    <div style={{ fontFamily: headFont, fontSize: 12, letterSpacing: 2, color: amber, margin: "14px 0 8px" }}>
                      FIELD NOTES
                    </div>
                    <div style={{ fontSize: 12.5, lineHeight: 1.6, whiteSpace: "pre-wrap" }}>{char.notes}</div>
                  </>
                )}
              </Panel>
            </div>
          </>
        )}

        <div
          style={{
            textAlign: "center",
            fontFamily: monoFont,
            fontSize: 9.5,
            letterSpacing: 2,
            color: "#3a4c5c",
            marginTop: 24,
          }}
        >
          — END TRANSMISSION · SIGNAL LOST BEYOND THE DARKMATTER VOID —
        </div>
      </div>
    </div>
  );
}

const linkBtnStyle = (color) => ({
  padding: "9px 12px",
  fontFamily: headFont,
  fontSize: 11.5,
  letterSpacing: 1,
  border: `1px solid ${color}`,
  borderRadius: 3,
  background: `${color}14`,
  color: color,
  cursor: "pointer",
  whiteSpace: "nowrap",
});

const hpBtnStyle = (color) => ({
  width: 34,
  height: 34,
  borderRadius: 3,
  border: `1px solid ${color}`,
  background: "#0a121d",
  color: color,
  fontSize: 17,
  fontWeight: 700,
  cursor: "pointer",
});

const tokBtnStyle = {
  width: 20,
  height: 20,
  borderRadius: 2,
  border: `1px solid #2c3f52`,
  background: "#111c29",
  color: textMain,
  fontSize: 12,
  fontWeight: 700,
  cursor: "pointer",
  lineHeight: 1,
};

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
